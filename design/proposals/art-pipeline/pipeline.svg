<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="system-ui, sans-serif">
<style>
text{fill:#2e2e2e}
.h{font-size:15px;font-weight:600}
.n{font-size:12px;font-weight:700}
.l{font-size:12px;font-weight:600}
.t{font-size:11px}
.s{font-size:10.5px;fill:#6f6a5e}
.w{font-size:11px;font-weight:600;fill:#8a4b12}
.box{fill:#ffffff;stroke:#b9b1a0;stroke-width:1}
.det{fill:#e8f1f0;stroke:#6f9c97;stroke-width:1}
.gen{fill:#fbefe0;stroke:#c99a62;stroke-width:1}
.hand{fill:#eef0f8;stroke:#8590b8;stroke-width:1}
.cache{fill:#2f3b40;stroke:none}
.ct{fill:#f3efe4;font-size:11.5px}
.cth{fill:#ffffff;font-size:13px;font-weight:700}
.ar{stroke:#7a7466;stroke-width:1.3;fill:none;marker-end:url(#a)}
.ard{stroke:#7a7466;stroke-width:1;fill:none;stroke-dasharray:3 3;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7a7466"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f4ec"/>
<text x="24" y="26" class="h">The art pipeline: the rig draws the body, the service paints it, the Caddy keeps it (Proposal)</text>
<text x="24" y="46" class="s">At Grow, inside the incubation minutes. Solid arrows: the job. Dashed: later, at the next dock or stage change.</text>

<!-- flow row -->
<g>
<rect x="24" y="64" width="176" height="148" rx="6" class="det"/>
<text x="34" y="82" class="n">1 Station: the rig</text>
<text x="34" y="100" class="t">genome committed; the rig</text>
<text x="34" y="114" class="t">renders the control set</text>
<text x="34" y="128" class="t">(views, silhouette, slots,</text>
<text x="34" y="142" class="t">index, marking passes) and</text>
<text x="34" y="156" class="t">the plain version, on screen</text>
<text x="34" y="170" class="t">within a second</text>
<text x="34" y="196" class="w">deterministic, same bytes</text>

<rect x="224" y="64" width="176" height="148" rx="6" class="det"/>
<text x="234" y="82" class="n">2 Caddy: the broker</text>
<text x="234" y="100" class="t">persistent queue; one</text>
<text x="234" y="114" class="t">request per output, in</text>
<text x="234" y="128" class="t">order of need; controls,</text>
<text x="234" y="142" class="t">species plate, fixed</text>
<text x="234" y="156" class="t">template, palette lock;</text>
<text x="234" y="170" class="t">retries on a schedule</text>
<text x="234" y="196" class="w">no connection: it waits</text>

<rect x="424" y="64" width="176" height="148" rx="6" class="gen"/>
<text x="434" y="82" class="n">3 Service: paints</text>
<text x="434" y="100" class="t">materials, face and pose</text>
<text x="434" y="114" class="t">from the species plate;</text>
<text x="434" y="128" class="t">body, slots and markings</text>
<text x="434" y="142" class="t">from the controls; never</text>
<text x="434" y="156" class="t">a new part or pigment;</text>
<text x="434" y="170" class="t">archives the call</text>
<text x="434" y="196" class="w">generated, per individual</text>

<rect x="624" y="64" width="176" height="148" rx="6" class="det"/>
<text x="634" y="82" class="n">4 Caddy: keeps</text>
<text x="634" y="100" class="t">content-addressed store,</text>
<text x="634" y="114" class="t">forever; manifest with</text>
<text x="634" y="128" class="t">model id, hashes, archive</text>
<text x="634" y="142" class="t">ids; the four-grey copy</text>
<text x="634" y="156" class="t">for its screen and print</text>
<text x="634" y="196" class="w">never deletes, never regenerates</text>

<rect x="824" y="64" width="156" height="148" rx="6" class="det"/>
<text x="834" y="82" class="n">5 Devices</text>
<text x="834" y="100" class="t">Station validates against</text>
<text x="834" y="114" class="t">the controls, derives the</text>
<text x="834" y="128" class="t">Companion version, swaps</text>
<text x="834" y="142" class="t">at the next fresh draw;</text>
<text x="834" y="156" class="t">Companion gets its mibis'</text>
<text x="834" y="170" class="t">sets at the dock</text>
<text x="834" y="196" class="w">plain until then</text>
</g>
<path d="M200 138 H222" class="ar"/><path d="M400 138 H422" class="ar"/><path d="M600 138 H622" class="ar"/><path d="M800 138 H822" class="ard"/>

<!-- account archive -->
<rect x="24" y="236" width="956" height="56" rx="6" class="cache"/>
<text x="38" y="258" class="cth">The account archive: the backup of every call (controls, request, returns, model id)</text>
<text x="38" y="276" class="ct">The Caddy is the copy of record; the archive restores a new Caddy by account. A lost object is re-rendered from its controls and marked repainted.</text>
<path d="M512 212 V234" class="ar"/><path d="M712 234 V214" class="ard"/>

<!-- outputs -->
<text x="24" y="322" class="l">Where each output comes from (the cut-off between unique and generic is what stage 1 tests; the default shown is cut-off B)</text>
<rect x="24" y="334" width="226" height="130" rx="6" class="gen"/>
<text x="34" y="352" class="n">Unique, from the service</text>
<text x="34" y="370" class="t">Station resident 300×310</text>
<text x="34" y="384" class="t">(master 600×620), one per life</text>
<text x="34" y="398" class="t">stage; the side view; stages</text>
<text x="34" y="412" class="t">painted ahead of the change</text>
<text x="34" y="426" class="t">with the prior stage as reference</text>
<text x="34" y="452" class="s">one or two calls in the budget</text>

<rect x="266" y="334" width="226" height="130" rx="6" class="det"/>
<text x="276" y="352" class="n">Unique, derived on the Station</text>
<text x="276" y="370" class="t">Companion resident 280×300:</text>
<text x="276" y="384" class="t">down-rendered, 48 ramps, outline</text>
<text x="276" y="398" class="t">from the index pass, no alpha;</text>
<text x="276" y="412" class="t">Caddy four-grey and 203 dpi</text>
<text x="276" y="426" class="t">print through the value table</text>
<text x="276" y="452" class="s">no call; nothing on the Companion</text>

<rect x="508" y="334" width="226" height="130" rx="6" class="hand"/>
<text x="518" y="352" class="n">Generic per species</text>
<text x="518" y="370" class="t">48 px token (idle 2, walk 3),</text>
<text x="518" y="384" class="t">partner face, thumbnails: the</text>
<text x="518" y="398" class="t">pixel artist's token rig, pigment</text>
<text x="518" y="412" class="t">slots remapped to the individual;</text>
<text x="518" y="426" class="t">book and cabinet portraits, look plates</text>
<text x="518" y="452" class="s">species plates in art/library/</text>

<rect x="750" y="334" width="230" height="130" rx="6" class="det"/>
<text x="760" y="352" class="n">Plain, from the rig</text>
<text x="760" y="370" class="t">every size, every mibi, offline</text>
<text x="760" y="384" class="t">and at once: real pigments, the</text>
<text x="760" y="398" class="t">outline rule, markings as fields,</text>
<text x="760" y="412" class="t">fixed eyes; the research-time</text>
<text x="760" y="426" class="t">picture; the fallback forever</text>
<text x="760" y="452" class="s">the game a kit that never connects plays</text>

<rect x="24" y="500" width="12" height="10" class="det"/><text x="42" y="509" class="s">deterministic, on the devices</text>
<rect x="224" y="500" width="12" height="10" class="gen"/><text x="242" y="509" class="s">generated per individual, checked by rule</text>
<rect x="484" y="500" width="12" height="10" class="hand"/><text x="502" y="509" class="s">signed by the art director, once per species</text>
<text x="24" y="540" class="s">Hidden copies are never in the controls or the template; unread chapters are frosted through the index pass on both versions. Pod and stamp: by rule, unchanged.</text>
</svg>
