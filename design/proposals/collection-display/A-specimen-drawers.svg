<text x="40" y="343" class="note" text-anchor="start">cotton; the label frame carries the name.</text>
<text x="40" y="410" class="note" text-anchor="start">Room to grow: empty drawer openings in the carcass,</text>
<text x="40" y="423" class="note" text-anchor="start">filled by the next drops. Risk: closed drawers in a</text>
<text x="40" y="436" class="note" text-anchor="start">grid are the rejected boxes with handles.</text>
