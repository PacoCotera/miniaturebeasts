<text x="500" y="320" class="note" text-anchor="start">Unmet: a sealed jar, paper-wrapped, plain wax, blank label.</text>
<text x="500" y="333" class="note" text-anchor="start">Twelve alike; the lid colour waits until met.</text>
<path d="M40 316 L80 240" class="lead"/><circle cx="80" cy="240" r="2" fill="#a0472c"/>
<text x="40" y="320" class="note" text-anchor="start">Found: clear glass, the face on a card inside, the name label;</text>
<text x="40" y="333" class="note" text-anchor="start">the clan colour on the lid. Met: frosted glass, a sketch.</text>
<text x="40" y="460" class="note" text-anchor="start">Room to grow: the third shelf, empty rings. Risks: a creature in a jar reads as preserved;</text>
<text x="40" y="474" class="note" text-anchor="start">jars suggest stock to take (knowledge, never material); and it is a shelf again.</text>
<path d="M700 466 L720 516" class="lead"/><circle cx="720" cy="516" r="2" fill="#a0472c"/>
<text x="700" y="470" class="note" text-anchor="start">Synopsis: jar caps, a fill gauge,</text>
<text x="700" y="483" class="note" text-anchor="start">clan wax seals.</text>
