<text x="540" y="100" class="note" text-anchor="start">Found: a small plate tipped in with photo corners, a tissue</text>
<text x="540" y="113" class="note" text-anchor="start">guard, the name inked below; the clan colour at its edge.</text>
<path d="M540 146 L420 240" class="lead"/><circle cx="420" cy="240" r="2" fill="#a0472c"/>
<text x="540" y="150" class="note" text-anchor="start">Unmet: an empty ruled frame with photo corners and</text>
<text x="540" y="163" class="note" text-anchor="start">a blank caption line. All alike.</text>
<path d="M540 196 L400 100" class="lead"/><circle cx="400" cy="100" r="2" fill="#a0472c"/>
<text x="540" y="200" class="note" text-anchor="start">Met: a pencil sketch, caption blank.</text>
<text x="540" y="250" class="note" text-anchor="start">Room to grow: the facing page, ruled margin only.</text>
<text x="540" y="263" class="note" text-anchor="start">Sixteen a page, thirty-two a spread; past that a</text>
<text x="540" y="276" class="note" text-anchor="start">page turn breaks the whole record at a glance.</text>
<text x="540" y="330" class="note" text-anchor="start">Risk: still rectangles on paper, the flatness</text>
<text x="540" y="343" class="note" text-anchor="start">the owner just rejected.</text>
<path d="M540 466 L300 530" class="lead"/><circle cx="300" cy="530" r="2" fill="#a0472c"/>
<text x="540" y="470" class="note" text-anchor="start">Synopsis: an inked rule for progress at the page</text>
<text x="540" y="483" class="note" text-anchor="start">foot; clan ribbons at the head band, one per clan met.</text>
