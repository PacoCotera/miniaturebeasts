<text x="40" y="300" class="note" text-anchor="start">Clan trays: a tray per clan, its colour along the top edge.</text>
<text x="40" y="313" class="note" text-anchor="start">A cousin widens its clan tray by one unit. Loika: the</text>
<text x="40" y="326" class="note" text-anchor="start">portrait with a gilt corner. Hiljan, met: a pencil sketch.</text>
<path d="M520 296 L600 200" class="lead"/><circle cx="600" cy="200" r="2" fill="#a0472c"/>
<text x="520" y="300" class="note" text-anchor="start">The plain tray: every unmet species is a bare mount and a</text>
<text x="520" y="313" class="note" text-anchor="start">blank tag, all alike, no colour, no shape. Met, a card</text>
<text x="520" y="326" class="note" text-anchor="start">leaves it for its clan tray.</text>
<text x="40" y="410" class="note" text-anchor="start">Room to grow: bare linen floor, faint tray footprints; the</text>
<text x="40" y="423" class="note" text-anchor="start">next drops slide in here. Holds 32 at the same 120×108 pitch.</text>
<path d="M520 406 L560 512" class="lead"/><circle cx="560" cy="512" r="2" fill="#a0472c"/>
<text x="520" y="410" class="note" text-anchor="start">Ledge: a string of tags (inked found, pencilled met, blank),</text>
<text x="520" y="423" class="note" text-anchor="start">a brass slider for progress, a cushion of clan pins.</text>
<text x="520" y="436" class="note" text-anchor="start">Glass: one cool reflection; cards cast short shadows.</text>
</svg>
