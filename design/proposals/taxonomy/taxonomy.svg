<text x="24" y="448" class="s">Breeding stays inside one species box. A clan is a resemblance (face part, anchor colour, pod pattern, stamp border half), never a breeding group.</text>
<text x="24" y="464" class="s">Catalogue6: 510 of 510 plans build (170 skeletons × 3 coverings); 360 to 1,440 clan signatures per plan.</text>
<text x="24" y="480" class="s">S01 to S03 are the species-frames files hopper, puffcap and glowtail (working ids); A to C are generated here (examples.json). V1 roster: §3.</text>
<text x="24" y="496" class="s">Generated by taxonomy.py through the species-frame method and the workbench resolver; every species built 200 random individuals.</text>
