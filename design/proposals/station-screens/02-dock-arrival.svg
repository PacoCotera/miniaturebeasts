<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600" font-family="system-ui, sans-serif">
<style>
.bg{fill:#f7f4ec}.bar{fill:#e4dfd0}.b{fill:none;stroke:#2e2e2e;stroke-width:1.5}.f{fill:#fffdf7;stroke:#2e2e2e;stroke-width:1.5}
.k{fill:none;stroke:#c9781e;stroke-width:3.5}.d{fill:none;stroke:#2e2e2e;stroke-width:1.2;stroke-dasharray:4 4}.sep{stroke:#9a9484;stroke-width:1}
.fill{fill:#cfc8b4;stroke:#2e2e2e;stroke-width:1.5}.ar{fill:none;stroke:#b0651a;stroke-width:1.5;stroke-dasharray:6 4}
text{fill:#2e2e2e}.h{font-size:20px;font-weight:600}.t{font-size:15px}.s{font-size:12px;fill:#6f6a5e}.n{font-size:12px;fill:#b0651a;font-style:italic}
</style>
<rect width="1024" height="600" class="bg"/>
<rect width="1024" height="40" class="bar"/>
<text x="16" y="27" class="h">Home</text><text x="88" y="27" class="t">T5</text>
<text x="512" y="27" class="t" text-anchor="middle">⚡ 9    ◆ 4    ❀ 6</text>
<text x="512" y="12" class="n" text-anchor="middle">after ✓: +4  +3  +7 tick in · T5 flashes to T7</text>
<text x="1008" y="27" class="t" text-anchor="end">Companion docked · 2 crates in the bay</text>
<!-- vivarium (dimmed, residents turn to look) -->
<rect x="16" y="52" width="640" height="498" rx="22" class="f"/>
<text x="34" y="76" class="s">VIVARIUM · residents turn toward the bench</text>
<ellipse cx="200" cy="400" rx="70" ry="42" class="b"/><text x="200" y="405" class="t" text-anchor="middle">Moss looks</text>
<ellipse cx="420" cy="360" rx="70" ry="42" class="b"/><text x="420" y="365" class="t" text-anchor="middle">Bean looks</text>
<rect x="60" y="120" width="552" height="54" rx="27" class="d"/>
<text x="336" y="152" class="t" text-anchor="middle">after ✓ a ribbon: Expedition 4 home · 2 pods · explored 9 of 21</text>
<text x="34" y="530" class="n">resting focus = the room, so ✓ opens the bay; focus never jumps to a thing</text>
<!-- bay with crates -->
<rect x="672" y="52" width="336" height="200" rx="14" class="f"/><rect x="668" y="48" width="344" height="208" rx="18" class="k"/>
<text x="690" y="76" class="t">bay door · open, glowing</text>
<rect x="692" y="92" width="140" height="120" rx="10" class="fill"/>
<text x="762" y="122" class="t" text-anchor="middle">sealed crate</text>
<rect x="737" y="134" width="50" height="34" rx="6" class="b"/><text x="762" y="156" class="s" text-anchor="middle">place</text>
<circle cx="742" cy="190" r="9" class="b"/><circle cx="764" cy="190" r="9" class="b"/>
<text x="762" y="208" class="s" text-anchor="middle">rock field · 2 pods</text>
<rect x="848" y="92" width="140" height="120" rx="10" class="fill"/>
<text x="918" y="122" class="t" text-anchor="middle">sealed crate</text>
<rect x="893" y="134" width="50" height="34" rx="6" class="b"/><text x="918" y="156" class="s" text-anchor="middle">place</text>
<circle cx="918" cy="190" r="9" class="b"/>
<text x="918" y="208" class="s" text-anchor="middle">meadow · 1 pod</text>
<text x="690" y="240" class="s">one crate per consignment (bay holds three)</text>
<!-- tray -->
<rect x="672" y="264" width="336" height="96" rx="14" class="f"/>
<text x="690" y="286" class="t">pod tray</text>
<circle cx="712" cy="326" r="18" class="fill"/><circle cx="764" cy="326" r="18" class="fill"/><circle cx="816" cy="326" r="18" class="b"/>
<circle cx="868" cy="326" r="18" class="b"/><circle cx="920" cy="326" r="18" class="b"/><circle cx="972" cy="326" r="18" class="b"/>
<path d="M762 214 C 790 260, 810 290, 816 306" class="ar"/><path d="M918 214 C 900 260, 880 290, 868 306" class="ar"/>
<text x="1000" y="290" class="n" text-anchor="end">pods roll in one by one</text>
<!-- incubator and cradle -->
<rect x="672" y="372" width="160" height="150" rx="14" class="f"/><text x="752" y="396" class="t" text-anchor="middle">incubator</text>
<circle cx="752" cy="456" r="40" class="b"/>
<rect x="848" y="372" width="160" height="150" rx="14" class="f"/><text x="928" y="396" class="t" text-anchor="middle">Probe cradle</text>
<rect x="884" y="440" width="26" height="12" class="fill"/><rect x="915" y="440" width="26" height="12" class="fill"/><rect x="946" y="440" width="26" height="12" class="b"/>
<text x="928" y="480" class="s" text-anchor="middle">after ✓: mended to 2</text>
<text x="672" y="542" class="n">one arrival per crate, in order, ~3 s each · presses consumed</text>
<!-- bottom line -->
<rect y="562" width="1024" height="38" class="bar"/>
<text x="16" y="587" class="t">✓ Open the bay  ·  ← Rest</text>
<line x1="236" y1="570" x2="236" y2="592" class="sep"/>
<text x="252" y="587" class="t">2 sealed crates</text>
<line x1="610" y1="570" x2="610" y2="592" class="sep"/>
<text x="1008" y="587" class="t" text-anchor="end">after: ✓ Look at the new pods</text>
</svg>
