<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600" font-family="system-ui, sans-serif">
<style>
.bg{fill:#f7f4ec}.b{fill:none;stroke:#2e2e2e;stroke-width:1.5}.f{fill:#fffdf7;stroke:#2e2e2e;stroke-width:1.5}
.m{fill:#e9e9ef;stroke:#8a8a99;stroke-width:1.5}.k{fill:none;stroke:#c9781e;stroke-width:3.5}
.d{fill:none;stroke:#2e2e2e;stroke-width:1.2;stroke-dasharray:4 4}.fill{fill:#cfc8b4;stroke:#2e2e2e;stroke-width:1.5}
.seed{fill:#eef0f6;stroke:#6b6f8a;stroke-width:1.5;stroke-dasharray:3 2}.r{fill:none;stroke:#2e2e2e;stroke-width:1}
text{fill:#2e2e2e}.h{font-size:18px;font-weight:600}.t{font-size:14px}.s{font-size:12px;fill:#6f6a5e}.n{font-size:12px;fill:#b0651a;font-style:italic}
</style>
<rect width="1024" height="600" class="bg"/>
<text x="16" y="28" class="h">Trait window states · fingerprint whorl (component sheet, Station size)</text>
<!-- row of six window states, each 150 wide -->
<g>
<path d="M20 200 V110 A75 60 0 0 1 170 110 V200 Z" class="m"/>
<text x="95" y="160" class="s" text-anchor="middle">frost, nothing behind</text>
<text x="95" y="222" class="t" text-anchor="middle">1 frosted</text><text x="95" y="238" class="s" text-anchor="middle">"markings"</text>
</g>
<g>
<path d="M188 200 V110 A75 60 0 0 1 338 110 V200 Z" class="m"/><text x="306" y="110" class="h">✦</text>
<text x="263" y="160" class="s" text-anchor="middle">a later pod</text>
<text x="263" y="222" class="t" text-anchor="middle">2 glint</text><text x="263" y="238" class="s" text-anchor="middle">"something new here"</text>
</g>
<g>
<path d="M356 200 V110 A75 60 0 0 1 506 110 V200 Z" class="f"/>
<path d="M376 100 q55 -26 110 0 M366 136 q65 -26 130 0 M364 172 q60 -24 100 -4" class="b"/>
<path d="M460 162 q14 -26 28 0 q0 22 -14 28 q-14 -6 -14 -28 z" class="seed"/>
<circle cx="470" cy="172" r="3" class="b"/><circle cx="479" cy="178" r="3" class="b"/><circle cx="472" cy="184" r="3" class="b"/>
<text x="431" y="222" class="t" text-anchor="middle">3 shows + hides</text><text x="431" y="238" class="s" text-anchor="middle">"shows stripes · hides spots"</text>
</g>
<g>
<path d="M524 200 V110 A75 60 0 0 1 674 110 V200 Z" class="f"/>
<path d="M544 100 q55 -26 110 0 M534 136 q65 -26 130 0" class="b"/>
<rect x="569" y="168" width="60" height="16" rx="4" class="fill"/>
<text x="599" y="222" class="t" text-anchor="middle">4 through and through</text><text x="599" y="238" class="s" text-anchor="middle">solid base, no seed</text>
</g>
<g>
<path d="M692 200 V110 A75 60 0 0 1 842 110 V200 Z" class="f"/>
<path d="M720 160 q20 -20 40 0 q20 20 40 0 q20 -20 40 0" class="b"/>
<circle cx="712" cy="104" r="8" class="b"/><circle cx="724" cy="104" r="8" class="b"/>
<text x="767" y="222" class="t" text-anchor="middle">5 family mark</text><text x="767" y="238" class="s" text-anchor="middle">"only through families"</text>
</g>
<g>
<path d="M860 200 V110 A75 60 0 0 1 1010 110 V200 Z" class="f"/>
<path d="M870 100 H1000 M864 120 H1006 M862 140 H1008 M862 160 H1008 M862 180 H1008" class="b"/>
<polygon points="935,128 948,146 935,170 922,146" class="fill"/>
<text x="935" y="222" class="t" text-anchor="middle">6 shutter</text><text x="935" y="238" class="s" text-anchor="middle">"opens with a crystal"</text>
</g>
<text x="16" y="270" class="n">picture area 150×110 · frame emblem names the window (swirl, crown, drop, paw) · one word under it · shapes carry meaning, colour doubles it</text>
<!-- create reel -->
<text x="16" y="304" class="h">On Create: a choosable window rolls (▲▼)</text>
<path d="M40 470 V380 A75 60 0 0 1 190 380 V470 Z" class="f"/><path d="M34 476 V378 A81 66 0 0 1 196 378 V476 Z" class="k"/>
<path d="M60 370 q55 -26 110 0 M50 406 q65 -26 130 0" class="b"/>
<path d="M144 432 q14 -26 28 0 q0 22 -14 28 q-14 -6 -14 -28 z" class="seed"/>
<text x="212" y="410" class="t" text-anchor="middle">▲</text><text x="212" y="450" class="t" text-anchor="middle">▼</text>
<text x="115" y="520" class="s" text-anchor="middle">as the pod is</text>
<path d="M230 470 V380 A60 50 0 0 1 350 380 V470 Z" class="f"/>
<circle cx="270" cy="410" r="6" class="b"/><circle cx="300" cy="430" r="6" class="b"/><circle cx="320" cy="400" r="6" class="b"/>
<rect x="260" y="448" width="60" height="12" rx="4" class="fill"/>
<rect x="316" y="356" width="60" height="18" rx="4" class="fill"/><text x="346" y="369" class="s" text-anchor="middle">changed</text>
<text x="290" y="498" class="s" text-anchor="middle">spots through</text><text x="290" y="512" class="s" text-anchor="middle">and through · +2 ◆</text>
<path d="M380 470 V380 A60 50 0 0 1 500 380 V470 Z" class="f"/>
<path d="M396 390 q44 -20 88 0 M392 420 q48 -20 96 0" class="b"/>
<rect x="410" y="448" width="60" height="12" rx="4" class="fill"/>
<text x="440" y="498" class="s" text-anchor="middle">stripes through</text><text x="440" y="512" class="s" text-anchor="middle">and through · +2 ◆</text>
<text x="16" y="548" class="n">only what this pod carries · frosted and family-marked windows don't roll · the founder redraws on each roll</text>
<!-- fingerprint -->
<text x="560" y="304" class="h">Fingerprint whorl</text>
<circle cx="680" cy="440" r="110" class="f"/>
<g transform="rotate(-45 680 440)"><ellipse cx="680" cy="380" rx="34" ry="46" class="fill"/>
<path d="M660 400 q20 -60 40 0 M666 404 q14 -44 28 0 M672 406 q8 -28 16 0" class="r"/><circle cx="680" cy="420" r="7" class="seed"/></g>
<g transform="rotate(45 680 440)"><ellipse cx="680" cy="380" rx="34" ry="46" class="b"/>
<path d="M660 400 q20 -60 40 0 M666 404 q14 -44 28 0 M672 406 q8 -28 16 0 M676 408 q4 -14 8 0" class="r"/></g>
<g transform="rotate(135 680 440)"><ellipse cx="680" cy="380" rx="34" ry="46" class="b"/>
<path d="M660 400 q20 -60 40 0 M666 404 q14 -44 28 0" class="r"/></g>
<g transform="rotate(225 680 440)"><ellipse cx="680" cy="380" rx="34" ry="46" class="b"/>
<path d="M660 400 q20 -60 40 0 M666 404 q14 -44 28 0 M672 406 q8 -28 16 0" class="r"/></g>
<circle cx="680" cy="440" r="16" class="fill"/>
<text x="680" y="572" class="t" text-anchor="middle">G7F · CD0 · 3H2</text>
<text x="804" y="350" class="s">one petal per window, same order</text>
<text x="804" y="366" class="s">lit petal: hue of what shows</text>
<text x="804" y="382" class="s">seed dot: what hides (once studied)</text>
<text x="804" y="398" class="s">plain ridges until studied</text>
<text x="804" y="420" class="s">ridge count + twist: hash of the code</text>
<text x="804" y="436" class="s">centre: species hue and emblem</text>
<text x="804" y="458" class="s">code: mibis only, grouped in threes</text>
<circle cx="830" cy="510" r="24" class="b"/><text x="830" y="548" class="s" text-anchor="middle">96 px card</text>
<circle cx="900" cy="514" r="12" class="b"/><text x="900" y="548" class="s" text-anchor="middle">40 px</text>
<circle cx="970" cy="508" r="34" class="d"/><text x="970" y="548" class="s" text-anchor="middle">220 px stamp</text>
</svg>
