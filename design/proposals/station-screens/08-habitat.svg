<path d="M656 240 V196 A32 26 0 0 1 720 196 V240 Z" class="f"/><path d="M736 240 V196 A32 26 0 0 1 800 196 V240 Z" class="f"/>
<path d="M816 240 V196 A32 26 0 0 1 880 196 V240 Z" class="f"/><path d="M896 240 V196 A32 26 0 0 1 960 196 V240 Z" class="f"/>
