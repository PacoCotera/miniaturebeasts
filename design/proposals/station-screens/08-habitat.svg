<rect x="16" y="460" width="992" height="90" rx="14" class="d"/>
<rect x="40" y="468" width="110" height="74" rx="10" class="fill"/><text x="95" y="535" class="s" text-anchor="middle">Fig</text>
<rect x="170" y="468" width="110" height="74" rx="10" class="f"/><text x="225" y="535" class="s" text-anchor="middle">Moss</text>
<rect x="300" y="468" width="110" height="74" rx="10" class="f"/><text x="355" y="535" class="s" text-anchor="middle">Bean</text>
<rect x="430" y="468" width="110" height="74" rx="10" class="f"/><text x="485" y="535" class="s" text-anchor="middle">Ash</text>
