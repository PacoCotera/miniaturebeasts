<rect width="100%" height="100%" class="bg"/>
<text x="30" y="24" class="h">What a species leaves open: the 114 paired loci of the authoring genome, split for one worked species (Proposal)</text>
<defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#e8b9cf"/><line x1="0" y1="0" x2="0" y2="5" stroke="#c0558a" stroke-width="2"/></pattern></defs><rect x="30.0" y="70" width="229.4" height="34" fill="#77736a" stroke="#f7f4ec"/><text x="144.7" y="91" class="t" text-anchor="middle" fill="#fff" style="fill:#fff">31</text><text x="32.0" y="120" class="s" transform="rotate(30 32.0 120)">Body-plan switches</text><rect x="259.4" y="70" width="192.4" height="34" fill="#b9b4a8" stroke="#f7f4ec"/><text x="355.6" y="91" class="t" text-anchor="middle" fill="#fff" style="fill:#fff">26</text><text x="261.4" y="120" class="s" transform="rotate(30 261.4 120)">Switched off here</text><rect x="451.8" y="70" width="44.4" height="34" fill="#c0558a" stroke="#f7f4ec"/><text x="474.0" y="91" class="t" text-anchor="middle" fill="#fff" style="fill:#fff">6</text><text x="453.8" y="120" class="s" transform="rotate(30 453.8 120)">Coat</text><rect x="496.2" y="70" width="37.0" height="34" fill="url(#hatch)" stroke="#f7f4ec"/><text x="514.7" y="91" class="t" text-anchor="middle" fill="#fff" style="fill:#fff">5</text><text x="498.2" y="120" class="s" transform="rotate(30 498.2 120)">(sleeping)</text><rect x="533.2" y="70" width="96.2" height="34" fill="#d08a2a" stroke="#f7f4ec"/><text x="581.3" y="91" class="t" text-anchor="middle" fill="#fff" style="fill:#fff">13</text><text x="535.2" y="120" class="s" transform="rotate(30 535.2 120)">Face</text><rect x="629.4" y="70" width="81.4" height="34" fill="#4f8f5b" stroke="#f7f4ec"/><text x="670.1" y="91" class="t" text-anchor="middle" fill="#fff" style="fill:#fff">11</text><text x="631.4" y="120" class="s" transform="rotate(30 631.4 120)">Shape</text><rect x="710.8" y="70" width="66.6" height="34" fill="#2f8f9a" stroke="#f7f4ec"/><text x="744.1" y="91" class="t" text-anchor="middle" fill="#fff" style="fill:#fff">9</text><text x="712.8" y="120" class="s" transform="rotate(30 712.8 120)">Legs &amp; tail</text><rect x="777.4" y="70" width="59.2" height="34" fill="#4a6fc0" stroke="#f7f4ec"/><text x="807.0" y="91" class="t" text-anchor="middle" fill="#fff" style="fill:#fff">8</text><text x="779.4" y="120" class="s" transform="rotate(30 779.4 120)">Movement</text><rect x="836.6" y="70" width="22.2" height="34" fill="#8a5cc0" stroke="#f7f4ec"/><text x="838.6" y="120" class="s" transform="rotate(30 838.6 120)">Stamina</text><rect x="858.8" y="70" width="14.8" height="34" fill="#a0624a" stroke="#f7f4ec"/><text x="860.8" y="120" class="s" transform="rotate(30 860.8 120)">Temperament</text><path d="M30.0 64 V56 H451.8 V64" fill="none" stroke="#2e2e2e"/><text x="240.9" y="50" class="t" text-anchor="middle">species frame, locked: 57 · learned once, at Identify</text><path d="M451.8 64 V56 H873.6 V64" fill="none" stroke="#2e2e2e"/><text x="662.7" y="50" class="t" text-anchor="middle">heritable: 57 · read pod by pod, chapter by chapter</text><path d="M451.8 142 V150 H777.4 V142" fill="none" stroke="#2e2e2e"/><text x="614.6" y="166" class="t" text-anchor="middle">looks: 44 · shapeable at creation</text><path d="M777.4 142 V150 H873.6 V142" fill="none" stroke="#2e2e2e"/><text x="825.5" y="166" class="t" text-anchor="middle">doings: 13 · only by breeding</text><text x="30" y="184" class="t">Pip proof (v1/prototype/genetics): 17 required facts</text><rect x="30" y="190" width="88.8" height="22" fill="#77736a"/><text x="74.4" y="205" class="t" text-anchor="middle" style="fill:#fff">12</text><rect x="118.8" y="190" width="7.4" height="22" fill="#c0558a" stroke="#f7f4ec"/><rect x="126.2" y="190" width="14.8" height="22" fill="#d08a2a" stroke="#f7f4ec"/><rect x="141.0" y="190" width="7.4" height="22" fill="#4a6fc0" stroke="#f7f4ec"/><rect x="148.4" y="190" width="7.4" height="22" fill="#8a5cc0" stroke="#f7f4ec"/><text x="163.8" y="205" class="s">12 locked (9 modules, 3 fixed loci) · 5 heritable: pale (Coat), crown and eye rings (Face), drive (Movement), efficiency (Stamina)</text><text x="30" y="236" class="s">Not drawn: 6 draft loci and the domains with no loci yet (maintenance, affinities, reproduction, fantastic physiology); unmodelled is shown as "not yet", never as zero.</text></svg>
