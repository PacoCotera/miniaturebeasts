<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" font-family="system-ui, sans-serif">
<style>
.bg{fill:#f7f4ec}
.rule{stroke:#d9d3c4;stroke-width:1}
.line{stroke:#2e2e2e;stroke-width:2;fill:none}
.disc{fill:#e3d9c6;stroke:#2e2e2e;stroke-width:1.5}
.unknown{fill:#ebe8e1;stroke:#8d887c;stroke-width:1.5;stroke-dasharray:4 3}
.stamp{fill:#fff;stroke:#2e2e2e;stroke-width:1}
.cell1{fill:#4a6fc0}
.cell2{fill:#c0554a}
.pod{fill:#b9b4a8;stroke:#2e2e2e;stroke-width:1.5}
.tab{fill:#5d6b78;stroke:#2e2e2e;stroke-width:1}
.focus{fill:none;stroke:#f0d890;stroke-width:3}
.shadow{fill:#2e2e2e;opacity:.12}
.cap{font-size:11px;fill:#6f6a5e}
.h{font-size:13px;font-weight:600;fill:#2e2e2e}
</style>
<rect width="100%" height="100%" class="bg"/>
<text x="20" y="22" class="h">Family tree, full-page node: a placeholder disc stands for the portrait, a square for the 40 px stamp mark (figure, not final art)</text>

<!-- generation rules: hairlines across the page, one per row -->
<line x1="20" y1="160" x2="580" y2="160" class="rule"/>
<line x1="20" y1="303" x2="580" y2="303" class="rule"/>
<line x1="20" y1="412" x2="580" y2="412" class="rule"/>

<!-- Row 1: wild founders A and B, each from a pod; the traded mate's parents, unknown -->
<!-- pod above A -->
<ellipse cx="150" cy="48" rx="9" ry="12" class="pod"/>
<line x1="141" y1="44" x2="159" y2="44" class="line" stroke-width="1.5"/>
<line x1="150" y1="60" x2="150" y2="66" class="line"/>
<!-- pod above B -->
<ellipse cx="250" cy="48" rx="9" ry="12" class="pod"/>
<line x1="241" y1="44" x2="259" y2="44" class="line" stroke-width="1.5"/>
<line x1="250" y1="60" x2="250" y2="66" class="line"/>
<!-- A -->
<circle cx="150" cy="90" r="24" class="disc"/>
<rect x="140" y="120" width="20" height="20" class="stamp"/>
<rect x="143" y="123" width="4" height="4" class="cell1"/><rect x="149" y="123" width="4" height="4" class="cell1"/>
<rect x="143" y="129" width="4" height="4" class="cell2"/><rect x="155" y="129" width="4" height="4" class="cell2"/>
<rect x="149" y="135" width="4" height="4" class="cell1"/><rect x="155" y="135" width="4" height="4" class="cell2"/>
<!-- B -->
<circle cx="250" cy="90" r="24" class="disc"/>
<rect x="240" y="120" width="20" height="20" class="stamp"/>
<rect x="249" y="123" width="4" height="4" class="cell1"/><rect x="255" y="123" width="4" height="4" class="cell1"/>
<rect x="243" y="129" width="4" height="4" class="cell2"/><rect x="249" y="129" width="4" height="4" class="cell2"/>
<rect x="243" y="135" width="4" height="4" class="cell1"/><rect x="255" y="135" width="4" height="4" class="cell2"/>
<!-- A joined to B, drop to their children -->
<line x1="174" y1="90" x2="226" y2="90" class="line"/>
<line x1="200" y1="90" x2="200" y2="185" class="line"/>

<!-- unknown parents of the traded mate -->
<circle cx="400" cy="90" r="24" class="unknown"/>
<circle cx="480" cy="90" r="24" class="unknown"/>
<line x1="424" y1="90" x2="456" y2="90" class="line" stroke-dasharray="4 3"/>
<line x1="440" y1="90" x2="440" y2="196" class="line" stroke-dasharray="4 3"/>

<!-- Row 2: siblings S1, the focused mibi F, S2; the traded mate T -->
<!-- sibling bar -->
<line x1="120" y1="185" x2="280" y2="185" class="line"/>
<line x1="120" y1="185" x2="120" y2="196" class="line"/>
<line x1="200" y1="185" x2="200" y2="196" class="line"/>
<line x1="280" y1="185" x2="280" y2="196" class="line"/>
<!-- S1 -->
<circle cx="120" cy="220" r="24" class="disc"/>
<rect x="110" y="250" width="20" height="20" class="stamp"/>
<rect x="113" y="253" width="4" height="4" class="cell1"/><rect x="125" y="253" width="4" height="4" class="cell1"/>
<rect x="119" y="259" width="4" height="4" class="cell2"/><rect x="125" y="259" width="4" height="4" class="cell2"/>
<rect x="113" y="265" width="4" height="4" class="cell1"/><rect x="119" y="265" width="4" height="4" class="cell2"/>
<!-- F, focused: lifted, with the warm cream focus ring and its stamp at 40 px -->
<ellipse cx="203" cy="248" rx="26" ry="5" class="shadow"/>
<circle cx="200" cy="218" r="30" class="focus"/>
<circle cx="200" cy="218" r="24" class="disc"/>
<rect x="180" y="252" width="40" height="40" class="stamp"/>
<rect x="183" y="255" width="34" height="34" fill="none" stroke="#2e2e2e" stroke-width="1"/>
<rect x="187" y="259" width="5" height="5" class="cell1"/><rect x="194" y="259" width="5" height="5" class="cell1"/><rect x="208" y="259" width="5" height="5" class="cell1"/>
<rect x="187" y="266" width="5" height="5" class="cell2"/><rect x="201" y="266" width="5" height="5" class="cell2"/><rect x="208" y="266" width="5" height="5" class="cell2"/>
<rect x="194" y="273" width="5" height="5" class="cell1"/><rect x="201" y="273" width="5" height="5" class="cell1"/>
<rect x="187" y="280" width="5" height="5" class="cell2"/><rect x="208" y="280" width="5" height="5" class="cell2"/>
<!-- S2 -->
<circle cx="280" cy="220" r="24" class="disc"/>
<rect x="270" y="250" width="20" height="20" class="stamp"/>
<rect x="279" y="253" width="4" height="4" class="cell1"/><rect x="285" y="253" width="4" height="4" class="cell1"/>
<rect x="273" y="259" width="4" height="4" class="cell2"/><rect x="279" y="259" width="4" height="4" class="cell2"/>
<rect x="285" y="265" width="4" height="4" class="cell1"/><rect x="273" y="265" width="4" height="4" class="cell2"/>
<!-- T, traded in: a crate tag on the disc's corner -->
<circle cx="440" cy="220" r="24" class="disc"/>
<rect x="452" y="194" width="16" height="11" rx="1" class="tab"/>
<line x1="452" y1="205" x2="458" y2="212" class="line" stroke-width="1.5"/>
<rect x="430" y="250" width="20" height="20" class="stamp"/>
<rect x="433" y="253" width="4" height="4" class="cell1"/><rect x="445" y="253" width="4" height="4" class="cell1"/>
<rect x="439" y="259" width="4" height="4" class="cell2"/><rect x="445" y="259" width="4" height="4" class="cell2"/>
<rect x="433" y="265" width="4" height="4" class="cell1"/><rect x="439" y="265" width="4" height="4" class="cell2"/>
<!-- F joined to T, drop to their children -->
<line x1="230" y1="220" x2="416" y2="220" class="line"/>
<line x1="320" y1="220" x2="320" y2="315" class="line"/>

<!-- Row 3: two children of F and T -->
<line x1="280" y1="315" x2="360" y2="315" class="line"/>
<line x1="280" y1="315" x2="280" y2="326" class="line"/>
<line x1="360" y1="315" x2="360" y2="326" class="line"/>
<circle cx="280" cy="350" r="24" class="disc"/>
<rect x="270" y="380" width="20" height="20" class="stamp"/>
<rect x="273" y="383" width="4" height="4" class="cell1"/><rect x="285" y="383" width="4" height="4" class="cell1"/>
<rect x="279" y="389" width="4" height="4" class="cell2"/><rect x="285" y="389" width="4" height="4" class="cell2"/>
<rect x="273" y="395" width="4" height="4" class="cell1"/><rect x="279" y="395" width="4" height="4" class="cell2"/>
<circle cx="360" cy="350" r="24" class="disc"/>
<rect x="350" y="380" width="20" height="20" class="stamp"/>
<rect x="359" y="383" width="4" height="4" class="cell1"/><rect x="365" y="383" width="4" height="4" class="cell1"/>
<rect x="353" y="389" width="4" height="4" class="cell2"/><rect x="359" y="389" width="4" height="4" class="cell2"/>
<rect x="365" y="395" width="4" height="4" class="cell1"/><rect x="353" y="395" width="4" height="4" class="cell2"/>

<!-- legend (captions are for this figure only; the Station tree carries no text) -->
<text x="20" y="430" class="cap">Pod over a disc: a wild founder, its pod as origin</text>
<text x="20" y="448" class="cap">Dashed misty disc: a parent the Station never saw</text>
<text x="320" y="430" class="cap">Corner tag: arrived by trade, in a crate</text>
<text x="320" y="448" class="cap">Cream ring, lifted: the mibi the page is about; its stamp at 40 px</text>
<text x="20" y="466" class="cap">Rows are generations; a bar joins two parents; the fork below it holds their children, side by side as siblings.</text>
</svg>
