<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600" font-family="Inter, sans-serif">
<title>Probe bench's navigation map: where it opens, what each key does, the Dock key's cut, where ← leads; the lift and the rings. 1024×600 at 1×.</title>
<defs><pattern id="g8" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="#efefef" stroke-width="0.5"/></pattern><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2b6cb0"/></marker></defs>
<rect width="1024" height="600" fill="#ffffff"/><rect width="1024" height="600" fill="url(#g8)"/>
<text x="16" y="24" font-size="13" fill="#222" font-weight="600" font-family="DejaVu Sans Mono, ui-monospace, monospace">Probe bench: how it opens, what each key does, where ← leads</text>
<rect x="16.5" y="64.5" width="183" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/>
<text x="108" y="84" font-size="12" fill="#222" text-anchor="middle" font-weight="600" font-family="DejaVu Sans Mono, ui-monospace, monospace">Home</text>
<text x="108" y="101" font-size="8" fill="#555" text-anchor="middle" font-family="DejaVu Sans Mono, ui-monospace, monospace">✓ on the Probe module</text>
<rect x="312.5" y="40.5" width="207" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/>
<text x="416" y="60" font-size="12" fill="#222" text-anchor="middle" font-weight="600" font-family="DejaVu Sans Mono, ui-monospace, monospace">Bench, docked: plates</text>
<text x="416" y="77" font-size="8" fill="#555" text-anchor="middle" font-family="DejaVu Sans Mono, ui-monospace, monospace">11 · a plate gone</text>
<rect x="312.5" y="112.5" width="207" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/>
<text x="416" y="132" font-size="12" fill="#222" text-anchor="middle" font-weight="600" font-family="DejaVu Sans Mono, ui-monospace, monospace">Bench, docked: switch</text>
<text x="416" y="149" font-size="8" fill="#555" text-anchor="middle" font-family="DejaVu Sans Mono, ui-monospace, monospace">every plate whole</text>
<rect x="312.5" y="184.5" width="207" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/>
<text x="416" y="204" font-size="12" fill="#222" text-anchor="middle" font-weight="600" font-family="DejaVu Sans Mono, ui-monospace, monospace">Bench, away: switch</text>
<text x="416" y="221" font-size="8" fill="#555" text-anchor="middle" font-family="DejaVu Sans Mono, ui-monospace, monospace">11c · the cradle empty</text>
<rect x="640.5" y="40.5" width="183" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/>
<text x="732" y="60" font-size="12" fill="#222" text-anchor="middle" font-weight="600" font-family="DejaVu Sans Mono, ui-monospace, monospace">Plates</text>
<text x="732" y="77" font-size="8" fill="#555" text-anchor="middle" font-family="DejaVu Sans Mono, ui-monospace, monospace">✓ Mend a plate · ⚡ 1</text>
<rect x="640.5" y="112.5" width="183" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/>
<text x="732" y="132" font-size="12" fill="#222" text-anchor="middle" font-weight="600" font-family="DejaVu Sans Mono, ui-monospace, monospace">Slot, armed</text>
<text x="732" y="149" font-size="8" fill="#555" text-anchor="middle" font-family="DejaVu Sans Mono, ui-monospace, monospace">11b · ✓ Again: fit the upgrade</text>
<rect x="640.5" y="184.5" width="183" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/>
<text x="732" y="204" font-size="12" fill="#222" text-anchor="middle" font-weight="600" font-family="DejaVu Sans Mono, ui-monospace, monospace">Tier 2 fitted</text>
<text x="732" y="221" font-size="8" fill="#555" text-anchor="middle" font-family="DejaVu Sans Mono, ui-monospace, monospace">11d · install held 900 ms</text>
<rect x="864.5" y="112.5" width="143" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/>
<text x="936" y="132" font-size="12" fill="#222" text-anchor="middle" font-weight="600" font-family="DejaVu Sans Mono, ui-monospace, monospace">Home</text>
<text x="936" y="149" font-size="8" fill="#555" text-anchor="middle" font-family="DejaVu Sans Mono, ui-monospace, monospace">← · ring on Probe</text>
<path d="M200 80L310 64" stroke="#2b6cb0" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="255" y="62" font-size="8" fill="#2b6cb0" text-anchor="middle" font-family="DejaVu Sans Mono, ui-monospace, monospace">a plate gone</text>
<path d="M200 90L310 136" stroke="#2b6cb0" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="255" y="112" font-size="8" fill="#2b6cb0" text-anchor="middle" font-family="DejaVu Sans Mono, ui-monospace, monospace">else</text>
<path d="M200 100L310 204" stroke="#2b6cb0" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="250" y="168" font-size="8" fill="#2b6cb0" text-anchor="middle" font-family="DejaVu Sans Mono, ui-monospace, monospace">away</text>
<path d="M520 64L638 64" stroke="#2b6cb0" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="579" y="59" font-size="8" fill="#2b6cb0" text-anchor="middle" font-family="DejaVu Sans Mono, ui-monospace, monospace">mend: 300 ms, held</text>
<path d="M520 136L638 136" stroke="#2b6cb0" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="579" y="131" font-size="8" fill="#2b6cb0" text-anchor="middle" font-family="DejaVu Sans Mono, ui-monospace, monospace">✓ on the slot</text>
<path d="M732 160L732 182" stroke="#2b6cb0" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="790" y="176" font-size="8" fill="#2b6cb0" text-anchor="middle" font-family="DejaVu Sans Mono, ui-monospace, monospace">second ✓</text>
<path d="M824 128L862 132" stroke="#2b6cb0" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="1012" y="176" font-size="8" fill="#555" text-anchor="end" font-family="DejaVu Sans Mono, ui-monospace, monospace">← from any target, any state</text>
<text x="312" y="252" font-size="8" fill="#555" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">Dock key on the bench: a cut. docked → away: a ring on the plates moves to the switch, the arm clears;</text>
<text x="312" y="263" font-size="8" fill="#555" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">away → docked: the ring stays, the plates as the dock left them, no mend event.</text>
<text x="16" y="300" font-size="12" fill="#222" font-weight="600" font-family="DejaVu Sans Mono, ui-monospace, monospace">Keys on the Probe bench</text>
<text x="16" y="322" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">opens on</text>
<text x="128" y="322" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">plates when the Probe is docked and a plate is gone; else switch</text>
<text x="16" y="336" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">pad</text>
<text x="128" y="336" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">plates ▶ the slot (the row nearest); ▲ ▼ switch, slot (order)</text>
<text x="16" y="350" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace"></text>
<text x="128" y="350" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">◀ from the column: the plates, or nothing while away; a move to nothing stays</text>
<text x="16" y="364" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">✓ plates</text>
<text x="128" y="364" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">Mend a plate ⚡ 1 (one a press); short: the dimmed cap, the short figure amber;</text>
<text x="16" y="378" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace"></text>
<text x="128" y="378" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">✓ says "needs more ⚡" on the message plate, nothing spent</text>
<text x="16" y="392" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">✓ switch</text>
<text x="128" y="392" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">Switch on / Switch off, no price, set at any time:</text>
<text x="16" y="406" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace"></text>
<text x="128" y="406" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">off "the dock mends two, free"; on "two free, the rest ⚡ 1 each"</text>
<text x="16" y="420" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace"></text>
<text x="128" y="420" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">(free economy: "the dock mends all, free")</text>
<text x="16" y="434" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">✓ ✓ slot</text>
<text x="128" y="434" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">arm (the part lifts 8 px), then fit at ⚡ 12 ◆ 4; short: the dimmed cap,</text>
<text x="16" y="448" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace"></text>
<text x="128" y="448" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">✓ says "needs more ⚡ ◆", nothing spent</text>
<text x="16" y="462" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">←</text>
<text x="128" y="462" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">Home, the ring on the Probe module</text>
<text x="16" y="476" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">room keys</text>
<text x="128" y="476" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">as everywhere; one pressed during a hold is kept</text>
<text x="664" y="300" font-size="12" fill="#222" font-weight="600" font-family="DejaVu Sans Mono, ui-monospace, monospace">States</text>
<text x="664" y="322" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">docked</text>
<text x="736" y="322" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">the Probe and its plates (tier 1 or 2)</text>
<text x="664" y="336" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">away</text>
<text x="736" y="336" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">the cradle empty, no plates, slot dim</text>
<text x="664" y="350" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">armed</text>
<text x="736" y="350" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">the slot after a first ✓ (focus)</text>
<text x="664" y="364" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">held</text>
<text x="736" y="364" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">mend 300 ms, install 900 ms;</text>
<text x="664" y="378" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace"></text>
<text x="736" y="378" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">the ring stays drawn, lifted, where it is</text>
<text x="664" y="392" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">lift</text>
<text x="736" y="392" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">the focused target and its contents</text>
<text x="664" y="406" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace"></text>
<text x="736" y="406" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">rise 2 px; ring 4 px outside</text>
<text x="664" y="420" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">rings</text>
<text x="736" y="420" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">plates 364,458 216×72</text>
<text x="664" y="434" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace"></text>
<text x="736" y="434" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">switch 620,90 320×136</text>
<text x="664" y="448" font-size="9" fill="#222" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace"></text>
<text x="736" y="448" font-size="9" fill="#333" text-anchor="start" font-family="DejaVu Sans Mono, ui-monospace, monospace">slot 620,266 320×256</text>
</svg>
