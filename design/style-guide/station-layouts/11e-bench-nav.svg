<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600" font-family="ui-monospace, Menlo, Consolas, monospace">
<title>Probe bench: how it opens, what each key does, where ← leads. 1024×600 at 1×.</title>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2b6cb0"/></marker><marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6b6880"/></marker></defs><rect width="1024" height="600" fill="#ffffff"/>
<text x="16" y="24" font-size="13" fill="#222" font-weight="600">Probe bench: how it opens, what each key does, where ← leads</text>
<rect x="16.5" y="64.5" width="183" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="108" y="84" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Home</text><text x="108" y="101" font-size="9" fill="#555" text-anchor="middle">✓ on the Probe module</text>
<rect x="312.5" y="40.5" width="207" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="416" y="60" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Bench, docked: plates</text><text x="416" y="77" font-size="9" fill="#555" text-anchor="middle">11 · a plate gone</text>
<rect x="312.5" y="112.5" width="207" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="416" y="132" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Bench, docked: switch</text><text x="416" y="149" font-size="9" fill="#555" text-anchor="middle">no plate gone</text>
<rect x="312.5" y="184.5" width="207" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="416" y="204" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Bench, away: switch</text><text x="416" y="221" font-size="9" fill="#555" text-anchor="middle">11c · the cradle empty</text>
<line x1="200" y1="80" x2="310" y2="64" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/><text x="255" y="62" font-size="9" fill="#2b6cb0" text-anchor="middle">a plate gone</text>
<line x1="200" y1="90" x2="310" y2="136" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/><text x="255" y="112" font-size="9" fill="#2b6cb0" text-anchor="middle">else</text>
<line x1="200" y1="100" x2="310" y2="204" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/><text x="250" y="168" font-size="9" fill="#2b6cb0" text-anchor="middle">away</text>
<rect x="640.5" y="40.5" width="183" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="732" y="60" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Plates</text><text x="732" y="77" font-size="9" fill="#555" text-anchor="middle">✓ Mend a plate · ⚡ 1</text>
<rect x="640.5" y="112.5" width="183" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="732" y="132" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Slot, armed</text><text x="732" y="149" font-size="9" fill="#555" text-anchor="middle">11b · ✓ Again: fit tier 2</text>
<rect x="640.5" y="184.5" width="183" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="732" y="204" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Tier 2 fitted</text><text x="732" y="221" font-size="9" fill="#555" text-anchor="middle">11d · install held 900 ms</text>
<line x1="520" y1="64" x2="638" y2="64" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/><text x="579" y="60" font-size="9" fill="#2b6cb0" text-anchor="middle">mend: 300 ms, held</text>
<line x1="520" y1="136" x2="638" y2="136" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/><text x="579" y="132" font-size="9" fill="#2b6cb0" text-anchor="middle">✓ on the slot</text>
<line x1="732" y1="160" x2="732" y2="182" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="790" y="176" font-size="9" fill="#2b6cb0">second ✓</text>
<rect x="864.5" y="112.5" width="143" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="936" y="132" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Home</text><text x="936" y="149" font-size="9" fill="#555" text-anchor="middle">← · ring on Probe</text>
<line x1="824" y1="128" x2="862" y2="132" stroke="#6b6880" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="936" y="176" font-size="9" fill="#6b6880" text-anchor="middle">← from any target, any state</text>
<text x="16" y="300" font-size="12" fill="#222" font-weight="600">Keys on the Probe bench</text><text x="16" y="320" font-size="10" fill="#222" font-weight="600">opens on</text><text x="128" y="320" font-size="10" fill="#333">the plates when docked and one is gone, else the switch</text><text x="16" y="335" font-size="10" fill="#222" font-weight="600">pad</text><text x="128" y="335" font-size="10" fill="#333">plates ▶ the slot (the row nearest); ▲ ▼ switch, slot (order)</text><text x="16" y="350" font-size="10" fill="#222" font-weight="600"></text><text x="128" y="350" font-size="10" fill="#333">◀ from the column: the plates, or nothing while away</text><text x="16" y="365" font-size="10" fill="#222" font-weight="600">✓ plates</text><text x="128" y="365" font-size="10" fill="#333">Mend a plate (one a press; a dimmed cap when short)</text><text x="16" y="380" font-size="10" fill="#222" font-weight="600">✓ switch</text><text x="128" y="380" font-size="10" fill="#333">Switch on / off: free, a standing choice, set at any time</text><text x="16" y="395" font-size="10" fill="#222" font-weight="600">✓ ✓ slot</text><text x="128" y="395" font-size="10" fill="#333">arm (the part lifts 8 px), then fit tier 2 at its price</text><text x="16" y="410" font-size="10" fill="#222" font-weight="600">←</text><text x="128" y="410" font-size="10" fill="#333">Home, the ring on the Probe module</text><text x="16" y="425" font-size="10" fill="#222" font-weight="600">room keys</text><text x="128" y="425" font-size="10" fill="#333">as everywhere</text>
<text x="600" y="300" font-size="12" fill="#222" font-weight="600">States</text><text x="600" y="320" font-size="10" fill="#222" font-weight="600">docked</text><text x="672" y="320" font-size="10" fill="#333">the Probe and its plates (tier 1 or 2)</text><text x="600" y="335" font-size="10" fill="#222" font-weight="600">away</text><text x="672" y="335" font-size="10" fill="#333">the cradle empty, no plates, slot dim</text><text x="600" y="350" font-size="10" fill="#222" font-weight="600">armed</text><text x="672" y="350" font-size="10" fill="#333">the slot after a first ✓ (focus)</text><text x="600" y="365" font-size="10" fill="#222" font-weight="600">held</text><text x="672" y="365" font-size="10" fill="#333">mend 300 ms, install 900 ms</text>
</svg>
