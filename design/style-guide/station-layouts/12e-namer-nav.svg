<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600" font-family="ui-monospace, Menlo, Consolas, monospace">
<title>The namer's navigation: how it opens (the meet's first ✓, ✓ Rename on Habitat), how the pad walks the keys, what ← does, and how it closes. 1024×600 at 1×.</title>
<defs><pattern id="g8" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="#efefef" stroke-width="0.5"/></pattern><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2b6cb0"/></marker><marker id="ao" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c45f12"/></marker><marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6b6880"/></marker></defs>
<rect width="1024" height="600" fill="#ffffff"/><rect width="1024" height="600" fill="url(#g8)"/>
<text x="16" y="22" font-size="13" fill="#222" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="600">The namer: how it opens, how the pad moves, how it closes</text>
<rect x="16.5" y="40.5" width="207" height="71" fill="#f4f8fc" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="24" y="57" font-size="13" fill="#222" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="600">Incubator, ready</text>
<text x="24" y="72" font-size="9" fill="#444">✓ Open: the hatch, input held</text>
<text x="24" y="84" font-size="9" fill="#444">2780 ms, then Habitat's meet</text>
<rect x="16.5" y="136.5" width="207" height="103" fill="#f4f8fc" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="24" y="153" font-size="13" fill="#222" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="600">Habitat, the meet</text>
<text x="24" y="168" font-size="9" fill="#444">the ring on the new mibi;</text>
<text x="24" y="180" font-size="9" fill="#444">the first ✓: ✓ Name Fig opens</text>
<text x="24" y="192" font-size="9" fill="#444">the namer; any other key ends</text>
<text x="24" y="204" font-size="9" fill="#444">the meet, the default kept,</text>
<text x="24" y="216" font-size="9" fill="#444">and does what it does</text>
<rect x="16.5" y="264.5" width="207" height="87" fill="#f4f8fc" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="24" y="281" font-size="13" fill="#222" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="600">Habitat, any time</text>
<text x="24" y="296" font-size="9" fill="#444">its name tag is the target:</text>
<text x="24" y="308" font-size="9" fill="#444">✓ Rename Fig opens the namer</text>
<text x="24" y="320" font-size="9" fill="#444">(any mibi at home, bonded</text>
<text x="24" y="332" font-size="9" fill="#444">or with you)</text>
<rect x="272.5" y="40.5" width="391" height="311" fill="#fff8f2" stroke="#c45f12" stroke-width="1.5"/>
<text x="280" y="57" font-size="13" fill="#222" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="600">The namer (an overlay)</text>
