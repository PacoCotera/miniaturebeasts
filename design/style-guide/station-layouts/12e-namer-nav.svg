<rect x="288.5" y="284.5" width="133" height="33" fill="#e8e8e8" stroke="#666" stroke-width="1"/>
<text x="355" y="306" font-size="12" fill="#222" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Suggest</text>
<rect x="428.5" y="284.5" width="133" height="33" fill="#e8e8e8" stroke="#666" stroke-width="1"/>
<text x="495" y="306" font-size="12" fill="#222" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Done</text>
<text x="572" y="90" font-size="9" fill="#c45f12">◀ ▶ ▲ ▼ walk</text>
<text x="572" y="102" font-size="9" fill="#c45f12">the grid; the</text>
<text x="572" y="114" font-size="9" fill="#c45f12">ends stop,</text>
<text x="572" y="126" font-size="9" fill="#c45f12">never a wrap</text>
<text x="572" y="246" font-size="9" fill="#c45f12">▼ from a key:</text>
<text x="572" y="258" font-size="9" fill="#c45f12">the key under it</text>
<text x="572" y="296" font-size="9" fill="#c45f12">opens on Done</text>
<text x="572" y="308" font-size="9" fill="#c45f12">◀ ▶ between the two</text>
<line x1="425" y1="232" x2="425" y2="238" stroke="#c45f12" stroke-width="1.5" marker-end="url(#ao)"/>
<rect x="688.5" y="40.5" width="319" height="159" fill="#f4f8fc" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="696" y="57" font-size="13" fill="#222" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="600">✓ on the focused key</text>
<text x="696" y="72" font-size="9" fill="#444">a letter or mark: types it (on the selection,</text>
<text x="696" y="84" font-size="9" fill="#444">  it replaces it); refused in words when full,</text>
<text x="696" y="96" font-size="9" fill="#444">  first, or beside another mark</text>
<text x="696" y="108" font-size="9" fill="#444">Aa: the next letter in the other case</text>
<text x="696" y="120" font-size="9" fill="#444">  (a first letter is always a capital)</text>
<text x="696" y="132" font-size="9" fill="#444">àéñ / abc: turns the page</text>
<text x="696" y="144" font-size="9" fill="#444">Suggest: the next pool name, selected</text>
<text x="696" y="156" font-size="9" fill="#444">Done: Name it Bean, or Keep Fig unchanged;</text>
<text x="696" y="168" font-size="9" fill="#444">  refused in words while it can't be saved</text>
<rect x="688.5" y="216.5" width="319" height="135" fill="#f4f8fc" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="696" y="233" font-size="13" fill="#222" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="600">← (the way back slot names it)</text>
<text x="696" y="248" font-size="9" fill="#444">a selection (as opened, or a suggestion):</text>
<text x="696" y="260" font-size="9" fill="#444">  ← Clear: the field empties</text>
<text x="696" y="272" font-size="9" fill="#444">typed letters: ← Delete, the last one</text>
<text x="696" y="284" font-size="9" fill="#444">an empty field: ← Habitat: the namer</text>
<text x="696" y="296" font-size="9" fill="#444">  closes and writes nothing</text>
<text x="696" y="308" font-size="9" fill="#444"></text>
<text x="696" y="320" font-size="9" fill="#444">Room keys and Idle close it too,</text>
<text x="696" y="332" font-size="9" fill="#444">  writing nothing; Dock leaves it open</text>
<rect x="272.5" y="376.5" width="391" height="103" fill="#f2fbf5" stroke="#2f855a" stroke-width="1.5"/>
<text x="280" y="393" font-size="13" fill="#222" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="600">Closes, back to Habitat</text>
<text x="280" y="408" font-size="9" fill="#444">Done ✓: the name saved at once, the namer closes, the name</text>
<text x="280" y="420" font-size="9" fill="#444">  regions on Habitat flash 240 ms. Keep, ← on empty: nothing</text>
<text x="280" y="432" font-size="9" fill="#444">  written or logged. The closing props' focus.set hands the</text>
<text x="280" y="444" font-size="9" fill="#444">  ring back: the resident after the meet (the meet ends),</text>
<text x="280" y="456" font-size="9" fill="#444">  the rename target after a rename</text>
<line x1="468" y1="352" x2="468" y2="372" stroke="#2f855a" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="688.5" y="376.5" width="319" height="103" fill="#f6f6f8" stroke="#6b6880" stroke-width="1.5"/>
<text x="696" y="393" font-size="13" fill="#222" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="600">A room key, Idle</text>
<text x="696" y="408" font-size="9" fill="#444">the namer closes, writing nothing, and the</text>
<text x="696" y="420" font-size="9" fill="#444">room's top opens (Idle: Home's living view);</text>
<text x="696" y="432" font-size="9" fill="#444">coming back to Habitat starts at the resident,</text>
<text x="696" y="444" font-size="9" fill="#444">with no namer</text>
<line x1="664" y1="340" x2="700" y2="372" stroke="#6b6880" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="16" y="512" font-size="10" fill="#444">The pad never leaves the namer and never spends; ✓ does exactly what the bottom line says; the overlay's own focus graph replaces Habitat's while it is open.</text>
<text x="16" y="528" font-size="10" fill="#444">Every character is reached with ◀ ▶ ▲ ▼ and typed with ✓: 26 letters and the two marks on the letters page, 24 accented letters on the accents page,</text>
<text x="16" y="544" font-size="10" fill="#444">space on the bottom row, capitals with Aa. At most 7 presses from Done to any key, 8 between any two.</text>
</svg>
