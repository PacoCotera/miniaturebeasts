<text x="16" y="504" font-size="10" fill="#555">Mini Create at half scale. Orange: ▲ ▼ roll the trait among its looks (step:up, step:down;</text>
<text x="16" y="517" font-size="10" fill="#555">wraps among three; a single look: nothing). Blue: ◀ ▶ the previous or next read trait in</text>
<text x="16" y="530" font-size="10" fill="#555">ring order (step:left, step:right; the ends stop). The ring never moves off the roll.</text>
<text x="560" y="200" font-size="13" fill="#222" font-weight="700">Keys on Create</text>
<text x="560" y="220" font-size="11" fill="#222" font-weight="600">opens on</text>
<text x="656" y="220" font-size="11" fill="#222">the roll, its first read trait, as the pod is</text>
<text x="560" y="235" font-size="11" fill="#222" font-weight="600">◀ ▶</text>
<text x="656" y="235" font-size="11" fill="#222">the previous, next read trait; the ends stop</text>
<text x="560" y="250" font-size="11" fill="#222" font-weight="600">▲ ▼</text>
<text x="656" y="250" font-size="11" fill="#222">the trait's look among its three; a single: nothing</text>
<text x="560" y="265" font-size="11" fill="#222" font-weight="600">✓</text>
<text x="656" y="265" font-size="11" fill="#222">Grow it: checked whole, then paid (03c)</text>
<text x="560" y="280" font-size="11" fill="#222" font-weight="600">✓ blocked</text>
<text x="656" y="280" font-size="11" fill="#222">clash, busy, no bay: no ✓ cap, nothing</text>
<text x="560" y="295" font-size="11" fill="#222" font-weight="600">✓ short</text>
<text x="656" y="295" font-size="11" fill="#222">dimmed cap: a plate names what is short</text>
<text x="560" y="310" font-size="11" fill="#222" font-weight="600">←</text>
<text x="656" y="310" font-size="11" fill="#222">the pod's overview, the ring on the pod;</text>
<text x="560" y="325" font-size="11" fill="#222" font-weight="600"></text>
<text x="656" y="325" font-size="11" fill="#222">nothing spent, the choices dropped</text>
<text x="560" y="340" font-size="11" fill="#222" font-weight="600">room keys</text>
<text x="656" y="340" font-size="11" fill="#222">drop the unpaid choices; back starts fresh</text>
<text x="560" y="355" font-size="11" fill="#222" font-weight="600">after Grow</text>
<text x="656" y="355" font-size="11" fill="#222">the Incubator; its ← reads Home (a jump)</text>
<text x="560" y="370" font-size="11" fill="#222" font-weight="600">held</text>
<text x="656" y="370" font-size="11" fill="#222">during the grow event, no key acts</text>
