<text x="16" y="514" font-size="10" fill="#555">Mini Create (shape) at half scale. Orange: ▲ ▼ roll the trait among its looks (step:up,</text>
<text x="16" y="527" font-size="10" fill="#555">step:down; wraps among three; a single look: nothing). Blue: ◀ ▶ the previous or next read</text>
<text x="16" y="540" font-size="10" fill="#555">trait in ring order (the ends stop). The ring never moves off the roll. Nothing read: no ring.</text>
<text x="560" y="248" font-size="13" fill="#222" font-weight="700">Keys on Create</text>
<text x="560" y="268" font-size="11" fill="#222" font-weight="600">opens on</text>
<text x="656" y="268" font-size="11" fill="#222">shape: the roll, the first read trait, as the pod is;</text>
<text x="560" y="283" font-size="11" fill="#222" font-weight="600"></text>
<text x="656" y="283" font-size="11" fill="#222">nothing read: the ring on nothing</text>
<text x="560" y="298" font-size="11" fill="#222" font-weight="600">◀ ▶</text>
<text x="656" y="298" font-size="11" fill="#222">the previous, next read trait; the ends stop</text>
<text x="560" y="313" font-size="11" fill="#222" font-weight="600">▲ ▼</text>
<text x="656" y="313" font-size="11" fill="#222">the trait's look among its three; a single: nothing</text>
<text x="560" y="328" font-size="11" fill="#222" font-weight="600">arrows</text>
<text x="656" y="328" font-size="11" fill="#222">nothing read: nothing</text>
<text x="560" y="343" font-size="11" fill="#222" font-weight="600">✓</text>
<text x="656" y="343" font-size="11" fill="#222">Grow it: checked whole, then paid (03c)</text>
<text x="560" y="358" font-size="11" fill="#222" font-weight="600">✓ blocked</text>
<text x="656" y="358" font-size="11" fill="#222">busy, no bay, clash: no ✓ cap, nothing</text>
<text x="560" y="373" font-size="11" fill="#222" font-weight="600">✓ short</text>
<text x="656" y="373" font-size="11" fill="#222">dimmed cap: a plate names what is short</text>
<text x="560" y="388" font-size="11" fill="#222" font-weight="600">←</text>
<text x="656" y="388" font-size="11" fill="#222">the pod's overview, the ring on the pod;</text>
<text x="560" y="403" font-size="11" fill="#222" font-weight="600"></text>
<text x="656" y="403" font-size="11" fill="#222">nothing spent, the choices dropped</text>
<text x="560" y="418" font-size="11" fill="#222" font-weight="600">room keys</text>
<text x="656" y="418" font-size="11" fill="#222">drop the unpaid choices; back starts fresh</text>
<text x="560" y="433" font-size="11" fill="#222" font-weight="600">after Grow</text>
<text x="656" y="433" font-size="11" fill="#222">the Incubator; its ← reads Home (a jump)</text>
<text x="560" y="448" font-size="11" fill="#222" font-weight="600">held</text>
<text x="656" y="448" font-size="11" fill="#222">during the grow event, no key acts</text>
