<text x="348" y="68" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Create, nothing read</text>
<text x="348" y="84" font-size="9" fill="#777" text-anchor="middle">03e · no ring</text>
<rect x="272.5" y="128.5" width="151" height="47" fill="#f2f2f2" stroke="#444" stroke-width="1"/>
