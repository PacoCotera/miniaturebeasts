<line x1="424" y1="152" x2="526" y2="120" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="475" y="116" font-size="9" fill="#2b6cb0" text-anchor="middle">✓ Grow it</text>
<line x1="680" y1="112" x2="782" y2="112" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="731" y="106" font-size="9" fill="#2b6cb0" text-anchor="middle">a jump, 1080 ms</text>
