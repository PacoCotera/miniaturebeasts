<text x="860" y="108" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Incubator</text>
<text x="860" y="124" font-size="9" fill="#777" text-anchor="middle">growing · ← Home</text>
<line x1="168" y1="104" x2="270" y2="74" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="168" y1="112" x2="270" y2="148" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/>
