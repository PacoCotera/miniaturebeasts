<text x="24" y="96" font-size="10">Not built yet, on Home: the sandbox opens here.</text>
<text x="24" y="110" font-size="10">The frame as on every screen: title, counters, Companion mark,</text>
<text x="24" y="124" font-size="10">turn; the bottom line; the message plate when a message shows.</text>
<text x="24" y="138" font-size="10">No picture, no targets, no focus ring.</text>
<text x="24" y="166" font-size="10">✓ and the pad: nothing (no ring, no plate).</text>
<text x="24" y="180" font-size="10">← goes to the parent (Home has none: no ← cap).</text>
<text x="24" y="194" font-size="10">Room keys open their rooms; Research opens Pods.</text>
<text x="24" y="208" font-size="10">Dock docks or lifts as everywhere; Home shows no arrival.</text>
<text x="24" y="222" font-size="10">60 s without a press: Idle, not built yet (13b).</text>
