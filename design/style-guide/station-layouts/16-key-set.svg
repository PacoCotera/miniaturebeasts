<text x="912" y="96" font-size="14" fill="#222" font-weight="700">What each key opens, and where the ring lands</text>
<circle cx="924" cy="130" r="11" fill="#dba53a" stroke="#1f2430" stroke-width="1"/>
<text x="944" y="135" font-size="13" fill="#222" font-weight="700">Home</text>
<text x="1416" y="135" font-size="10" fill="#777" text-anchor="end">#dba53a</text>
<text x="944" y="156" font-size="11" fill="#333">Opens Home, the ring on the room (what needs you).</text>
<text x="944" y="171" font-size="11" fill="#333">On Home: the ring back to the room.</text>
<text x="944" y="186" font-size="11" fill="#333">Its icon marks the titles Home and Cargo.</text>
<circle cx="924" cy="221" r="11" fill="#63a046" stroke="#1f2430" stroke-width="1"/>
<text x="944" y="226" font-size="13" fill="#222" font-weight="700">Vivarium</text>
<text x="1416" y="226" font-size="10" fill="#777" text-anchor="end">#63a046</text>
<text x="944" y="247" font-size="11" fill="#333">Opens the Vivarium's whole (15b), the ring on the mibi</text>
<text x="944" y="262" font-size="11" fill="#333">last seen up close: its resident, or its bay tile while it is</text>
<text x="944" y="277" font-size="11" fill="#333">out with the Companion. None seen yet: the first resident</text>
<text x="944" y="292" font-size="11" fill="#333">from the left; none at home: the first bay.</text>
<text x="944" y="307" font-size="11" fill="#333">From one mibi up close: the whole, the ring on that mibi.</text>
<text x="944" y="322" font-size="11" fill="#333">Its icon marks the Vivarium, one mibi, Cross, Sitting.</text>
<circle cx="924" cy="357" r="11" fill="#2a9f90" stroke="#1f2430" stroke-width="1"/>
<text x="944" y="362" font-size="13" fill="#222" font-weight="700">Research</text>
<text x="1416" y="362" font-size="10" fill="#777" text-anchor="end">#2a9f90</text>
<text x="944" y="383" font-size="11" fill="#333">Opens Pods, the collection, the ring on the pod that most</text>
<text x="944" y="398" font-size="11" fill="#333">needs the player: a new one, then a glinting one, then the first.</text>
<text x="944" y="413" font-size="11" fill="#333">From a pod, a chapter, Compare or Create: the collection.</text>
<text x="944" y="428" font-size="11" fill="#333">Its icon marks Pods, Create, the Incubator, the Probe.</text>
<circle cx="924" cy="463" r="11" fill="#8460cd" stroke="#1f2430" stroke-width="1"/>
<text x="944" y="468" font-size="13" fill="#222" font-weight="700">Library</text>
<text x="1416" y="468" font-size="10" fill="#777" text-anchor="end">#8460cd</text>
<text x="944" y="489" font-size="11" fill="#333">Opens the Library's spread, the ring on the frame it was</text>
<text x="944" y="504" font-size="11" fill="#333">last on. From the Book: the spread, the ring on that species.</text>
<text x="944" y="519" font-size="11" fill="#333">Its icon marks the Library and the Book.</text>
<line x1="912" y1="544" x2="1416" y2="544" stroke="#ccc"/>
<text x="912" y="568" font-size="11" fill="#222" font-weight="700">Every key</text>
<text x="984" y="568" font-size="11" fill="#333">never spends; it drops Create's and Cross's unpaid choices</text>
<text x="984" y="583" font-size="11" fill="#333">and closes the namer, writing nothing; while a moment holds</text>
<text x="984" y="598" font-size="11" fill="#333">input (the arrival, the hatch), it waits.</text>
<text x="912" y="619" font-size="11" fill="#222" font-weight="700">No key</text>
<text x="984" y="619" font-size="11" fill="#333">Cargo, the Incubator, the Probe: one press from Home's</text>
<text x="984" y="634" font-size="11" fill="#333">column. Cargo calls from the room (the amber module and the</text>
<text x="984" y="649" font-size="11" fill="#333">notice); the Incubator is reached by its jumps too.</text>
<text x="912" y="670" font-size="11" fill="#222" font-weight="700">The row</text>
<text x="984" y="670" font-size="11" fill="#333">reads like Home: the Vivarium at the left as the panel is,</text>
<text x="984" y="685" font-size="11" fill="#333">the column's sections to the right, the Library at its foot.</text>
<text x="912" y="706" font-size="11" fill="#222" font-weight="700">Fit</text>
<text x="984" y="706" font-size="11" fill="#333">four keys on the four positions, x 64, 88, 112, 136 mm.</text>
<text x="984" y="721" font-size="11" fill="#333">Each cap carries one icon in a 10×10 mm slot, no word;</text>
<text x="984" y="736" font-size="11" fill="#333">the title mark is the same icon at 24×24. A fifth key does</text>
<text x="984" y="751" font-size="11" fill="#333">not fit: 15 mm free left of x 64, 16 mm right of x 136.</text>
</svg>
