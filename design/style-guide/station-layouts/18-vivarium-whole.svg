<text x="24" y="64" font-size="10" fill="#2b6cb0" font-family="DejaVu Sans Mono, ui-monospace, monospace">The whole: the Vivarium's first level, every mibi at home at its size.</text>
<text x="24" y="77" font-size="10" fill="#2b6cb0" font-family="DejaVu Sans Mono, ui-monospace, monospace">Reads first: the residents, then the bays. Nothing else on the stage:</text>
<text x="24" y="90" font-size="10" fill="#2b6cb0" font-family="DejaVu Sans Mono, ui-monospace, monospace">no card, no modules, no stamp; no word in the window but the name tag.</text>
<text x="24" y="103" font-size="10" fill="#2b6cb0" font-family="DejaVu Sans Mono, ui-monospace, monospace">Targets: each resident (the feet ring, sleepers too) and each housed tile.</text>
<text x="24" y="116" font-size="10" fill="#2b6cb0" font-family="DejaVu Sans Mono, ui-monospace, monospace">▼ from a resident: its tile. ▲ from a tile: its resident.</text>
<text x="24" y="129" font-size="10" fill="#2b6cb0" font-family="DejaVu Sans Mono, ui-monospace, monospace">✓ on either: one mibi up close. ← Home, the ring on the panel.</text>
