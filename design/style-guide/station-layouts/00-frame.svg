<text x="380" y="200" font-size="14" fill="#999">stage: the screen's own layout</text>
<text x="32" y="72" font-size="11" fill="#333">TOP BAR, 40 px: where you are | what you hold | who is out, when</text>
<text x="32" y="92" font-size="11" fill="#333">Title 16,8 232×24: room mark 24×24 at 16,8; title from x 48, 20 px medium bone; one word</text>
<text x="32" y="112" font-size="11" fill="#333">Holdings 384,8 256×24: Energy, Data, Essence centred on 512; icon 16, gap 4, figures 16 px</text>
<text x="32" y="132" font-size="11" fill="#333">Companion 760,8 120×24: glyph 16×24 at 760,8 (outline when away), lamp 8×8 at 780,16 (mint docked, stone away),</text>
<text x="32" y="148" font-size="11" fill="#333">   three face places 24×24 at 800, 828, 856 (y 8): the mibis with you in carried order, an empty ring a free place; no words</text>
<text x="32" y="168" font-size="11" fill="#333">When 904,8 104×24: sun mark 16, 4 px, the turn's figure, right-aligned to 1008</text>
<text x="32" y="360" font-size="11" fill="#333">BOTTOM LINE, 38 px: the one action | the context | the notice, then the way back at the right edge</text>
<text x="32" y="380" font-size="11" fill="#333">Action 16,570 376×24: ✓ cap 16 orange at 16,574, verb orange (4 words or fewer), 24 px, price icon + figures</text>
<text x="32" y="400" font-size="11" fill="#333">Context 408,570 208×24: centred on 512, mist, a label of six words or fewer; the only part that shrinks</text>
<text x="32" y="420" font-size="11" fill="#333">Notice 624,570 280×24: right-aligned to 904, amber, a sentence of six words or fewer, its 12×12 lamp 4 px to its left</text>
<text x="32" y="440" font-size="11" fill="#333">Way back 928,570 80×24: the ← cap 16 stone and one word in fog, right-aligned to 1008, as on the Companion</text>
<text x="32" y="460" font-size="11" fill="#333">Rules x 404 and x 620; the notice and the way back are grouped by their 24 px gap, no rule</text>
