<text x="24" y="64" font-size="10" fill="#2b6cb0" font-family="DejaVu Sans Mono, ui-monospace, monospace">Empty: no mibi yet. The window, six free bays and the frame.</text>
<text x="24" y="77" font-size="10" fill="#2b6cb0" font-family="DejaVu Sans Mono, ui-monospace, monospace">No ring, no ✓ cap; the context says it. The empty Vivarium</text>
<text x="24" y="90" font-size="10" fill="#2b6cb0" font-family="DejaVu Sans Mono, ui-monospace, monospace">does not lead toward growing: Home's ✓ leads to what needs you.</text>
