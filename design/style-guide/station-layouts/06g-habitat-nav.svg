<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600" font-family="ui-monospace, Menlo, Consolas, monospace">
<title>Habitat: how it opens, what each key does, where ✓ and ← lead. 1024×600 at 1×.</title>
