<text x="16" y="24" font-size="13" fill="#222" font-weight="600">Habitat: how it opens, what each key does, where ✓ and ← lead</text>
<rect x="16.5" y="48.5" width="167" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="100" y="68" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Home</text><text x="100" y="85" font-size="9" fill="#555" text-anchor="middle">✓ Look at Fig · ✓ Meet Fig</text>
<rect x="16.5" y="112.5" width="167" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="100" y="132" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Incubator, hatch</text><text x="100" y="149" font-size="9" fill="#555" text-anchor="middle">✓ Open (a jump)</text>
<rect x="16.5" y="176.5" width="167" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="100" y="196" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Book, guide</text><text x="100" y="213" font-size="9" fill="#555" text-anchor="middle">✓ Visit Fig (a jump)</text>
<rect x="16.5" y="240.5" width="167" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="100" y="260" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Any screen</text><text x="100" y="277" font-size="9" fill="#555" text-anchor="middle">the Habitat key</text>
<rect x="296.5" y="64.5" width="199" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="396" y="84" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Habitat, meet</text><text x="396" y="101" font-size="9" fill="#555" text-anchor="middle">06b · the ring on the new mibi</text>
<rect x="296.5" y="160.5" width="199" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="396" y="180" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Habitat, rest</text><text x="396" y="197" font-size="9" fill="#555" text-anchor="middle">06 · the ring on the mibi</text>
<rect x="296.5" y="256.5" width="199" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="396" y="276" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Habitat, empty</text><text x="396" y="293" font-size="9" fill="#555" text-anchor="middle">06e · no mibi; no ring</text>
<line x1="184" y1="72" x2="294" y2="84" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/><text x="239" y="68" font-size="9" fill="#2b6cb0" text-anchor="middle">✓ Meet</text>
<line x1="184" y1="136" x2="294" y2="92" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/><text x="239" y="124" font-size="9" fill="#2b6cb0" text-anchor="middle">dither 180</text>
<line x1="184" y1="200" x2="294" y2="184" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/><text x="230" y="206" font-size="9" fill="#2b6cb0" text-anchor="middle">✓ Visit</text>
<line x1="184" y1="72" x2="294" y2="176" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/><text x="236" y="140" font-size="9" fill="#2b6cb0" text-anchor="middle">✓ Look at</text>
<line x1="184" y1="264" x2="294" y2="192" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/><text x="232" y="252" font-size="9" fill="#2b6cb0" text-anchor="middle">the last seen</text>
<line x1="184" y1="268" x2="294" y2="276" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/><text x="239" y="284" font-size="9" fill="#2b6cb0" text-anchor="middle">no mibi</text>
<line x1="396" y1="112" x2="396" y2="158" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/><text x="440" y="140" font-size="9" fill="#2b6cb0" text-anchor="middle">first press</text>
<rect x="640.5" y="48.5" width="167" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="724" y="68" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Cross</text><text x="724" y="85" font-size="9" fill="#555" text-anchor="middle">✓ Cross Fig · ← Habitat</text>
<rect x="640.5" y="120.5" width="167" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="724" y="140" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Book, guide</text><text x="724" y="157" font-size="9" fill="#555" text-anchor="middle">✓ Open the guide (a jump)</text>
<rect x="640.5" y="192.5" width="167" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="724" y="212" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Sitting</text><text x="724" y="229" font-size="9" fill="#555" text-anchor="middle">✓ Portray Fig</text>
<rect x="640.5" y="264.5" width="167" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="724" y="284" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Home</text><text x="724" y="301" font-size="9" fill="#555" text-anchor="middle">← · ring on Fig, or the room</text>
<line x1="496" y1="172" x2="638" y2="76" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/><text x="567" y="120" font-size="9" fill="#2b6cb0" text-anchor="middle">Cross module</text>
<line x1="496" y1="180" x2="638" y2="144" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/><text x="567" y="156" font-size="9" fill="#2b6cb0" text-anchor="middle">species word</text>
<line x1="496" y1="188" x2="638" y2="214" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="567" y="196" font-size="9" fill="#2b6cb0" text-anchor="middle">Portrait module</text>
<line x1="496" y1="196" x2="638" y2="286" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/><text x="567" y="250" font-size="9" fill="#2b6cb0" text-anchor="middle">←</text>
<text x="916" y="76" font-size="9" fill="#6b6880" text-anchor="middle">← there: Habitat,</text>
<text x="916" y="88" font-size="9" fill="#6b6880" text-anchor="middle">the ring on Cross</text>
<text x="916" y="148" font-size="9" fill="#6b6880" text-anchor="middle">← there reads Library</text>
<text x="916" y="220" font-size="9" fill="#6b6880" text-anchor="middle">its screen is</text>
<text x="916" y="232" font-size="9" fill="#6b6880" text-anchor="middle">not designed yet</text>
<text x="16" y="344" font-size="12" fill="#222" font-weight="600">Keys on Habitat</text><text x="16" y="364" font-size="10" fill="#222" font-weight="600">opens on</text><text x="144" y="364" font-size="10" fill="#333">the mibi (meet: the new one; the key: the last seen)</text><text x="16" y="379" font-size="10" fill="#222" font-weight="600">pad</text><text x="144" y="379" font-size="10" fill="#333">focus.graph: mibi ▶ species ▼ plates ▼ modules ▼ strip</text><text x="16" y="394" font-size="10" fill="#222" font-weight="600">strip ◀ ▶</text><text x="144" y="394" font-size="10" fill="#333">walks the tiles; each shows its mibi (200 ms dither)</text><text x="16" y="409" font-size="10" fill="#222" font-weight="600">✓ mibi, tile</text><text x="144" y="409" font-size="10" fill="#333">Spend time: its moment, held 300 ms</text><text x="16" y="424" font-size="10" fill="#222" font-weight="600">✓ species</text><text x="144" y="424" font-size="10" fill="#333">Open the guide (a jump; ← there Library)</text><text x="16" y="439" font-size="10" fill="#222" font-weight="600">✓ plate</text><text x="144" y="439" font-size="10" fill="#333">Read a bred child's chapter, at its price</text><text x="16" y="454" font-size="10" fill="#222" font-weight="600">✓ Companion</text><text x="144" y="454" font-size="10" fill="#333">Take it with you, now or at the next dock</text><text x="16" y="469" font-size="10" fill="#222" font-weight="600">✓ ✓ Bond, Wild</text><text x="144" y="469" font-size="10" fill="#333">arm, then act; any other key clears</text><text x="16" y="484" font-size="10" fill="#222" font-weight="600">✓ Cross</text><text x="144" y="484" font-size="10" fill="#333">opens Cross; ← there is Habitat</text><text x="16" y="499" font-size="10" fill="#222" font-weight="600">←</text><text x="144" y="499" font-size="10" fill="#333">Home, wherever Habitat came from</text>
<text x="560" y="344" font-size="12" fill="#222" font-weight="600">States</text><text x="560" y="364" font-size="10" fill="#222" font-weight="600">rest</text><text x="640" y="364" font-size="10" fill="#333">one mibi shown</text><text x="560" y="379" font-size="10" fill="#222" font-weight="600">meet</text><text x="640" y="379" font-size="10" fill="#333">the first look at a new mibi, until</text><text x="560" y="394" font-size="10" fill="#222" font-weight="600"></text><text x="640" y="394" font-size="10" fill="#333">the first press: the ribbon in the tag's place</text><text x="560" y="409" font-size="10" fill="#222" font-weight="600">empty</text><text x="640" y="409" font-size="10" fill="#333">no mibi: the glass, the free bays</text><text x="560" y="424" font-size="10" fill="#222" font-weight="600">armed</text><text x="640" y="424" font-size="10" fill="#333">Bond or Wild after a first ✓ (focus)</text><text x="560" y="439" font-size="10" fill="#222" font-weight="600">held</text><text x="640" y="439" font-size="10" fill="#333">moment 300, read 300, bond 300,</text><text x="560" y="454" font-size="10" fill="#222" font-weight="600"></text><text x="640" y="454" font-size="10" fill="#333">release 200 ms</text>
</svg>
