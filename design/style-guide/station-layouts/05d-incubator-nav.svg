<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600" font-family="ui-monospace, Menlo, Consolas, monospace">
<title>Incubator: the navigation map, the states and the hand-off to Habitat's meet, 1024×600 at 1×.</title>
<defs><pattern id="g8" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="#efefef" stroke-width="0.5"/></pattern><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2b6cb0"/></marker><marker id="ao" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c45f12"/></marker><marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6b6880"/></marker></defs>
<rect width="1024" height="600" fill="#ffffff"/><rect width="1024" height="600" fill="url(#g8)"/>
<text x="16" y="24" font-size="14" fill="#222" font-weight="600">Incubator: how it opens, how its states follow, where Open leads (no ring: ✓ acts on the room)</text>
<rect x="16.5" y="56.5" width="151" height="47" fill="#f2f2f2" stroke="#444" stroke-width="1"/>
<text x="92" y="76" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Home</text>
<text x="92" y="92" font-size="9" fill="#777" text-anchor="middle">Incubator module, ✓</text>
<rect x="16.5" y="136.5" width="151" height="47" fill="#f2f2f2" stroke="#444" stroke-width="1"/>
<text x="92" y="156" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Create</text>
<text x="92" y="172" font-size="9" fill="#777" text-anchor="middle">✓ Grow it (a jump)</text>
<rect x="16.5" y="216.5" width="151" height="47" fill="#f2f2f2" stroke="#444" stroke-width="1"/>
<text x="92" y="236" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Cross</text>
<text x="92" y="252" font-size="9" fill="#777" text-anchor="middle">✓ Cross them (a jump)</text>
<rect x="272.5" y="56.5" width="151" height="47" fill="#f2f2f2" stroke="#444" stroke-width="1"/>
<text x="348" y="76" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Incubator, empty</text>
<text x="348" y="92" font-size="9" fill="#777" text-anchor="middle">05c · ✓ Choose a pod</text>
<rect x="272.5" y="176.5" width="151" height="47" fill="#f2f2f2" stroke="#444" stroke-width="1"/>
<text x="348" y="196" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Incubator, growing</text>
<text x="348" y="212" font-size="9" fill="#777" text-anchor="middle">04 · ✓ Grow now</text>
<rect x="528.5" y="176.5" width="151" height="47" fill="#f2f2f2" stroke="#444" stroke-width="1"/>
<text x="604" y="196" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Incubator, ready</text>
<text x="604" y="212" font-size="9" fill="#777" text-anchor="middle">05 · ✓ Open</text>
<rect x="784.5" y="176.5" width="151" height="47" fill="#f2f2f2" stroke="#444" stroke-width="1"/>
<text x="860" y="196" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Incubator, hatch</text>
<text x="860" y="212" font-size="9" fill="#777" text-anchor="middle">05b · held 2780 ms</text>
<rect x="784.5" y="296.5" width="151" height="47" fill="#f2f2f2" stroke="#444" stroke-width="1"/>
<text x="860" y="316" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Vivarium, meet</text>
<text x="860" y="332" font-size="9" fill="#777" text-anchor="middle">V · ← Vivarium</text>
<rect x="528.5" y="56.5" width="151" height="47" fill="#f2f2f2" stroke="#444" stroke-width="1"/>
<text x="604" y="76" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Home</text>
<text x="604" y="92" font-size="9" fill="#777" text-anchor="middle">ring on the Incubator</text>
<rect x="784.5" y="56.5" width="151" height="47" fill="#f2f2f2" stroke="#444" stroke-width="1"/>
<text x="860" y="76" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Pods, collection</text>
<text x="860" y="92" font-size="9" fill="#777" text-anchor="middle">ring on the first pod</text>
<line x1="168" y1="80" x2="270" y2="80" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="219" y="74" font-size="9" fill="#2b6cb0" text-anchor="middle">no bud</text>
<line x1="168" y1="92" x2="270" y2="190" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="226" y="128" font-size="9" fill="#2b6cb0">a bud: growing</text>
<text x="226" y="139" font-size="9" fill="#2b6cb0">or ready</text>
<line x1="168" y1="160" x2="270" y2="196" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="168" y1="240" x2="270" y2="208" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="424" y1="200" x2="526" y2="200" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="475" y="194" font-size="9" fill="#2b6cb0" text-anchor="middle">minutes pass</text>
<text x="475" y="216" font-size="9" fill="#2b6cb0" text-anchor="middle">✓ Grow now, 400 ms</text>
<line x1="680" y1="200" x2="782" y2="200" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="731" y="194" font-size="9" fill="#2b6cb0" text-anchor="middle">✓ Open</text>
<text x="731" y="216" font-size="9" fill="#2b6cb0" text-anchor="middle">(a bay free)</text>
<line x1="860" y1="226" x2="860" y2="294" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="866" y="264" font-size="9" fill="#2b6cb0">dither 180 ms (a jump)</text>
<line x1="424" y1="68" x2="526" y2="68" stroke="#6b6880" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="475" y="62" font-size="10" fill="#6b6880" text-anchor="middle">←</text>
<path d="M 424 96 C 560 130, 700 120, 782 96" fill="none" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="604" y="140" font-size="9" fill="#2b6cb0" text-anchor="middle">✓ Choose a pod (a jump; ← Home there)</text>
<path d="M 348 174 C 380 150, 470 130, 528 100" fill="none" stroke="#6b6880" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ag)"/>
<text x="380" y="160" font-size="9" fill="#6b6880">← from growing or ready</text>
<text x="16" y="384" font-size="13" fill="#222" font-weight="700">Keys on the Incubator</text>
<text x="16" y="404" font-size="11" fill="#222" font-weight="600">opens on</text>
<text x="112" y="404" font-size="11" fill="#222">the room: no ring is drawn, in every state</text>
<text x="16" y="419" font-size="11" fill="#222" font-weight="600">pad</text>
<text x="112" y="419" font-size="11" fill="#222">nothing: one subject</text>
<text x="16" y="434" font-size="11" fill="#222" font-weight="600">✓ empty</text>
<text x="112" y="434" font-size="11" fill="#222">Choose a pod: Pods, the ring on the first identified</text>
<text x="16" y="449" font-size="11" fill="#222" font-weight="600"></text>
<text x="112" y="449" font-size="11" fill="#222">pod; only with a pod in the rack and a bay free</text>
<text x="16" y="464" font-size="11" fill="#222" font-weight="600">✓ growing</text>
<text x="112" y="464" font-size="11" fill="#222">Grow now · ❀ (1 a 2 minutes left); short: dimmed</text>
<text x="16" y="479" font-size="11" fill="#222" font-weight="600">✓ ready</text>
<text x="112" y="479" font-size="11" fill="#222">Open: the hatch, then Habitat's meet</text>
<text x="16" y="494" font-size="11" fill="#222" font-weight="600">✓ no bay</text>
<text x="112" y="494" font-size="11" fill="#222">ready: a guard; a dimmed cap, a plate, the notice</text>
<text x="16" y="509" font-size="11" fill="#222" font-weight="600">←</text>
<text x="112" y="509" font-size="11" fill="#222">Home, the ring on the Incubator module</text>
<text x="16" y="524" font-size="11" fill="#222" font-weight="600">room keys</text>
<text x="112" y="524" font-size="11" fill="#222">as everywhere</text>
<text x="16" y="539" font-size="11" fill="#222" font-weight="600">held</text>
<text x="112" y="539" font-size="11" fill="#222">Grow now (400 ms), the hatch (2780 ms)</text>
<text x="560" y="384" font-size="13" fill="#222" font-weight="700">States</text>
<text x="560" y="404" font-size="11" fill="#222" font-weight="600">empty</text>
<text x="640" y="404" font-size="11" fill="#222">no bud: it invites a new one</text>
<text x="560" y="419" font-size="11" fill="#222" font-weight="600">growing</text>
<text x="640" y="419" font-size="11" fill="#222">the bud's first state</text>
<text x="560" y="434" font-size="11" fill="#222" font-weight="600">ready</text>
<text x="640" y="434" font-size="11" fill="#222">the bud's second</text>
<text x="560" y="449" font-size="11" fill="#222" font-weight="600">hatch</text>
<text x="640" y="449" font-size="11" fill="#222">the Open event; input held;</text>
<text x="560" y="464" font-size="11" fill="#222" font-weight="600"></text>
<text x="640" y="464" font-size="11" fill="#222">after it, the Incubator is empty.</text>
<text x="560" y="479" font-size="11" fill="#222" font-weight="600"></text>
<text x="640" y="479" font-size="11" fill="#222">No prize render state (superseded</text>
<text x="560" y="494" font-size="11" fill="#222" font-weight="600"></text>
<text x="640" y="494" font-size="11" fill="#222">10-08: a portrait comes as a crate).</text>
</svg>
