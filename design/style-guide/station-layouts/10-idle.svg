<text x="20" y="589" font-size="9" fill="#777" font-family="DejaVu Sans Mono, ui-monospace, monospace">strip 0,568 1024×32 · line 16,568 992×32</text>
<text x="1004" y="589" font-size="9" fill="#777" text-anchor="end" font-family="DejaVu Sans Mono, ui-monospace, monospace">16 px mist, centred; six words or fewer</text>
<text x="300" y="48" font-size="10" fill="#2b6cb0" font-family="DejaVu Sans Mono, ui-monospace, monospace">Never a screen off: residents awake, walking and resting, full light for the time of day.</text>
<text x="300" y="61" font-size="10" fill="#2b6cb0" font-family="DejaVu Sans Mono, ui-monospace, monospace">What moves: the residents, the sleepers breathing, the light. Nothing blinks or counts.</text>
<text x="300" y="74" font-size="10" fill="#2b6cb0" font-family="DejaVu Sans Mono, ui-monospace, monospace">No top bar, no bottom line, no ring, no plate. The first press wakes, nothing else,</text>
<text x="300" y="87" font-size="10" fill="#2b6cb0" font-family="DejaVu Sans Mono, ui-monospace, monospace">back to the screen under Idle as it was. After 60 s without a press, or ✓ Rest on Home.</text>
<text x="300" y="100" font-size="10" fill="#2b6cb0" font-family="DejaVu Sans Mono, ui-monospace, monospace">The line: crates, the bud ready, a bud growing, who is out (away only); else empty.</text>
</svg>
