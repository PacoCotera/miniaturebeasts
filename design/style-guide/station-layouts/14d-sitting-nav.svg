<text x="16" y="24" font-size="13" fill="#222" font-weight="600">Sitting: how it opens, its three steps, where ✓ and ← lead</text>
<rect x="16.5" y="56.5" width="183" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="108" y="76" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Habitat</text><text x="108" y="93" font-size="9" fill="#555" text-anchor="middle">✓ Portray Fig (Portrait module)</text>
<rect x="272.5" y="56.5" width="167" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="356" y="76" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Pose</text><text x="356" y="93" font-size="9" fill="#555" text-anchor="middle">14 · ✓ Pick this pose</text>
<rect x="512.5" y="56.5" width="167" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="596" y="76" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Place</text><text x="596" y="93" font-size="9" fill="#555" text-anchor="middle">14b · ✓ Pick this place</text>
<rect x="752.5" y="56.5" width="199" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="852" y="76" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Look and confirm</text><text x="852" y="93" font-size="9" fill="#555" text-anchor="middle">14c · ✓ Portray, ✓ again</text>
<line x1="200" y1="72" x2="270" y2="72" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/><text x="235" y="66" font-size="9" fill="#2b6cb0" text-anchor="middle">✓ Portray</text>
<line x1="440" y1="72" x2="510" y2="72" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/><text x="475" y="68" font-size="9" fill="#2b6cb0" text-anchor="middle">✓</text>
<line x1="680" y1="72" x2="750" y2="72" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/><text x="715" y="68" font-size="9" fill="#2b6cb0" text-anchor="middle">✓</text>
<line x1="270" y1="92" x2="200" y2="92" stroke="#6b6880" stroke-width="1.5" marker-end="url(#ag)"/><text x="235" y="104" font-size="9" fill="#6b6880" text-anchor="middle">←</text>
<line x1="510" y1="92" x2="440" y2="92" stroke="#6b6880" stroke-width="1.5" marker-end="url(#ag)"/><text x="475" y="104" font-size="9" fill="#6b6880" text-anchor="middle">←</text>
<line x1="750" y1="92" x2="680" y2="92" stroke="#6b6880" stroke-width="1.5" marker-end="url(#ag)"/><text x="715" y="104" font-size="9" fill="#6b6880" text-anchor="middle">←</text>
<rect x="752.5" y="168.5" width="199" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="852" y="188" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Begin</text><text x="852" y="205" font-size="9" fill="#555" text-anchor="middle">held 480 ms: gilt out 300, then 180</text>
<line x1="852" y1="104" x2="852" y2="166" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/><text x="896" y="140" font-size="9" fill="#2b6cb0" text-anchor="middle">second ✓</text>
<rect x="272.5" y="168.5" width="303" height="47" fill="#f4f4f2" stroke="#444" stroke-width="1"/><text x="424" y="188" font-size="12" fill="#222" text-anchor="middle" font-weight="600">Habitat</text><text x="424" y="205" font-size="9" fill="#555" text-anchor="middle">the ring on Portrait (painting); the plate</text>
<line x1="750" y1="192" x2="578" y2="192" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#ah)"/><text x="664" y="186" font-size="9" fill="#2b6cb0" text-anchor="middle">dither 180</text>
<text x="424" y="236" font-size="9" fill="#6b6880" text-anchor="middle">Home: the crate fills in the Bay; the slot empty, or held if a welcome waited</text>
<text x="16" y="300" font-size="12" fill="#222" font-weight="600">Keys on the sitting</text><text x="16" y="320" font-size="10" fill="#222" font-weight="600">opens on</text><text x="112" y="320" font-size="10" fill="#333">always the pose step, the ring on card.0, no choice made</text><text x="16" y="335" font-size="10" fill="#222" font-weight="600">pad</text><text x="112" y="335" font-size="10" fill="#333">pose and place: the ring among the cards (nearest that way); confirm: nothing</text><text x="16" y="350" font-size="10" fill="#222" font-weight="600">✓</text><text x="112" y="350" font-size="10" fill="#333">pose and place: take it, a step forward; confirm: arm, then begin</text><text x="16" y="365" font-size="10" fill="#222" font-weight="600">←</text><text x="112" y="365" font-size="10" fill="#333">a step back, every choice kept; from the pose, Habitat (Portrait)</text><text x="16" y="380" font-size="10" fill="#222" font-weight="600">room keys</text><text x="112" y="380" font-size="10" fill="#333">leave the screen; nothing is spent</text><text x="16" y="395" font-size="10" fill="#222" font-weight="600">held</text><text x="112" y="395" font-size="10" fill="#333">begin, 480 ms, presses consumed</text><text x="16" y="410" font-size="10" fill="#222" font-weight="600">a visit</text><text x="112" y="410" font-size="10" fill="#333">leaving the screen drops every choice</text>
<text x="640" y="300" font-size="12" fill="#222" font-weight="600">States</text><text x="640" y="320" font-size="10" fill="#222" font-weight="600">pose</text><text x="712" y="320" font-size="10" fill="#333">the habits seen</text><text x="640" y="335" font-size="10" fill="#222" font-weight="600">place</text><text x="712" y="335" font-size="10" fill="#333">the places been</text><text x="640" y="350" font-size="10" fill="#222" font-weight="600">confirm</text><text x="712" y="350" font-size="10" fill="#333">the gilt frame; armed lit</text><text x="640" y="365" font-size="10" fill="#222" font-weight="600">begin</text><text x="712" y="365" font-size="10" fill="#333">the frame leaves; held</text>
</svg>
