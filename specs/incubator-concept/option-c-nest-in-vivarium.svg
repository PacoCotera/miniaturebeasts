<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="600" viewBox="0 0 1024 600" font-family="Inter, Helvetica, Arial, sans-serif">
  <!-- Incubator concept, option C: the nest in the vivarium. 1x wireframe, layout and content only; not a layout spec. Growing, about two thirds through. -->
  <rect width="1024" height="600" fill="#1d1f24"/>
  <rect x="0" y="0" width="1024" height="40" fill="#23262d"/>
  <text x="20" y="26" font-size="20" fill="#e9e2d0">Incubator</text>
  <text x="430" y="26" font-size="16" fill="#e9e2d0">⚡ 7   ◆ 2   ❀ 9</text>

  <!-- the living window, full stage -->
  <rect x="16" y="48" width="992" height="506" fill="#4f6a3e" stroke="#9aa79a" stroke-width="6"/>
  <rect x="16" y="48" width="992" height="200" fill="#6f8a5a"/>
  <text x="40" y="80" font-size="12" fill="#e9e2d0">the vivarium, as on Home and Idle: warm daylight, moss, roots, water</text>
  <ellipse cx="200" cy="420" rx="60" ry="40" fill="#3a3a40"/><text x="200" y="424" font-size="12" fill="#e9e2d0" text-anchor="middle">resident</text>
  <ellipse cx="340" cy="450" rx="54" ry="36" fill="#3a3a40"/><text x="340" y="454" font-size="12" fill="#e9e2d0" text-anchor="middle">resident</text>
  <text x="270" y="386" font-size="11" fill="#e9e2d0" text-anchor="middle">they come closer as it nears</text>

  <!-- the sheltered nest, foreground right -->
  <path d="M560 300 Q700 200 860 300 L880 520 L540 520 Z" fill="#3e4a2f" stroke="#2b3420" stroke-width="3"/>
  <text x="710" y="250" font-size="11" fill="#e9e2d0" text-anchor="middle">a sheltering root arch</text>
  <ellipse cx="710" cy="486" rx="150" ry="30" fill="#6e7d45"/>
  <ellipse cx="710" cy="390" rx="78" ry="96" fill="#5b7790" stroke="#c9d3dc" stroke-width="3"/>
  <text x="710" y="386" font-size="13" fill="#e9e2d0" text-anchor="middle">your pod</text>
  <text x="710" y="404" font-size="13" fill="#e9e2d0" text-anchor="middle">in its nest</text>

  <!-- the device's one piece: a moulded warming post with the ring -->
  <rect x="890" y="330" width="44" height="190" rx="12" fill="#9aa79a" stroke="#55625a" stroke-width="3"/>
  <circle cx="912" cy="300" r="46" fill="#2f3236" stroke="#55625a" stroke-width="4"/>
  <circle cx="912" cy="300" r="34" fill="none" stroke="#454a4f" stroke-width="12"/>
  <path d="M912 266 A34 34 0 1 1 882.6 317" fill="none" stroke="#9fc47a" stroke-width="12"/>
  <text x="912" y="236" font-size="11" fill="#e9e2d0" text-anchor="middle">warming post</text>
  <text x="912" y="250" font-size="11" fill="#e9e2d0" text-anchor="middle">with the ring</text>

  <!-- cleared note, a small card on the glass -->
  <rect x="40" y="104" width="224" height="88" rx="8" fill="#2f3236" stroke="#9aa79a" stroke-width="2" opacity="0.92"/>
  <rect x="48" y="112" width="72" height="72" fill="#d9d0bc"/>
  <text x="130" y="140" font-size="14" fill="#e9c27a">Movement</text>
  <text x="130" y="160" font-size="14" fill="#cfc6b4">just cleared</text>

  <rect x="0" y="562" width="1024" height="38" fill="#23262d"/>
  <text x="20" y="587" font-size="16" fill="#e8743b">✓ Grow now</text>
  <text x="128" y="587" font-size="16" fill="#e9e2d0">❀ 4</text>
  <text x="430" y="587" font-size="16" fill="#9aa0a8">a Loika, ready in about 7 min</text>
  <text x="1004" y="587" font-size="16" fill="#e9e2d0" text-anchor="end">← Home</text>
</svg>
