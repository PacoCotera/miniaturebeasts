<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="600" viewBox="0 0 1024 600" font-family="Inter, Helvetica, Arial, sans-serif">
  <!-- Incubator concept, option B: candling. 1x wireframe, layout and content only; not a layout spec. Growing, about five sixths through. -->
  <rect width="1024" height="600" fill="#1d1f24"/>
  <rect x="0" y="0" width="1024" height="40" fill="#23262d"/>
  <text x="20" y="26" font-size="20" fill="#e9e2d0">Incubator</text>
  <text x="430" y="26" font-size="16" fill="#e9e2d0">⚡ 7   ◆ 2   ❀ 9</text>
  <rect x="0" y="40" width="1024" height="522" fill="#7d8f7a"/>
  <rect x="48" y="56" width="928" height="490" rx="18" fill="#2f3236" stroke="#22252a" stroke-width="4"/>

  <!-- the slip from Create, left -->
  <rect x="80" y="88" width="208" height="300" rx="6" fill="#e6dcc4" stroke="#8b7f66" stroke-width="2"/>
  <rect x="160" y="80" width="48" height="16" rx="3" fill="#6c6a66"/>
  <text x="96" y="126" font-size="28" fill="#2f2a22">Loika</text>
  <text x="96" y="150" font-size="14" fill="#5f574a">found at the pond edge,</text>
  <text x="96" y="168" font-size="14" fill="#5f574a">as a Loika shook dry</text>
  <line x1="96" y1="186" x2="272" y2="186" stroke="#8b7f66"/>
  <text x="96" y="210" font-size="16" fill="#2f2a22">Your changes</text>
  <text x="96" y="234" font-size="14" fill="#2f2a22">Crown: only leafy</text>
  <text x="96" y="254" font-size="14" fill="#2f2a22">Markings: only pale</text>
  <line x1="96" y1="272" x2="272" y2="272" stroke="#8b7f66"/>
  <text x="96" y="296" font-size="16" fill="#2f2a22">Cleared while growing</text>
  <text x="96" y="320" font-size="14" fill="#2f2a22">Movement: a quick trot</text>
  <text x="96" y="340" font-size="14" fill="#5f574a">Stamina: still to come</text>
  <text x="96" y="376" font-size="11" fill="#5f574a">the same slip as on Create</text>

  <!-- progress ring: time, segmented at each chapter clearing -->
  <circle cx="512" cy="304" r="214" fill="none" stroke="#454a4f" stroke-width="22"/>
  <path d="M512 90 A214 214 0 1 1 326.7 197" fill="none" stroke="#9fc47a" stroke-width="22"/>
  <g fill="#e9e2d0" font-size="11" text-anchor="middle">
    <circle cx="726" cy="304" r="15" fill="#2f3236" stroke="#e9e2d0" stroke-width="2"/><text x="726" y="308">C</text>
    <circle cx="512" cy="518" r="15" fill="#2f3236" stroke="#e9e2d0" stroke-width="2"/><text x="512" y="522">F</text>
    <circle cx="298" cy="304" r="15" fill="#2f3236" stroke="#e9c27a" stroke-width="2"/><text x="298" y="308">M</text>
    <circle cx="512" cy="90" r="15" fill="#2f3236" stroke="#6c6a66" stroke-width="2"/><text x="512" y="94">S</text>
  </g>
  <text x="512" y="72" font-size="11" fill="#b9b0a0" text-anchor="middle">ready when the ring closes</text>

  <!-- candling cradle: warm light from below, through the shell -->
  <ellipse cx="512" cy="448" rx="150" ry="30" fill="#55625a" stroke="#9aa79a" stroke-width="3"/>
  <ellipse cx="512" cy="440" rx="110" ry="18" fill="#6e7d45"/>
  <ellipse cx="512" cy="430" rx="80" ry="10" fill="#f3c27a" opacity="0.8"/>
  <!-- the player's own pod, large, shell lit from beneath -->
  <ellipse cx="512" cy="292" rx="118" ry="136" fill="#5b7790" stroke="#c9d3dc" stroke-width="3"/>
  <ellipse cx="512" cy="330" rx="88" ry="84" fill="#f3c27a" opacity="0.35"/>
  <!-- the founder's silhouette showing through -->
  <path d="M440 352 Q446 290 500 288 Q520 250 548 262 Q590 270 586 320 Q600 356 572 368 L452 368 Q432 366 440 352 Z" fill="#2c3440" opacity="0.65"/>
  <path d="M500 270 L494 246 L510 260 L520 240 L526 262" fill="none" stroke="#2c3440" stroke-width="5" opacity="0.65"/>
  <text x="512" y="196" font-size="12" fill="#e9e2d0" text-anchor="middle">your pod, its own shell</text>
  <text x="512" y="396" font-size="12" fill="#2f2a22" text-anchor="middle">your founder, inside</text>

  <!-- just cleared, right -->
  <rect x="744" y="88" width="200" height="236" rx="10" fill="#3a3f44" stroke="#9aa79a" stroke-width="2"/>
  <text x="760" y="116" font-size="16" fill="#e9c27a">Just cleared</text>
  <rect x="764" y="128" width="160" height="140" rx="6" fill="#d9d0bc"/>
  <text x="844" y="202" font-size="12" fill="#5f574a" text-anchor="middle">the trait, as a picture</text>
  <text x="760" y="296" font-size="16" fill="#e9e2d0">Movement</text>
  <text x="760" y="314" font-size="14" fill="#cfc6b4">a quick trot</text>
  <!-- the stamp, in the shared slot -->
  <rect x="804" y="380" width="120" height="120" rx="6" fill="#4b4741" stroke="#9aa79a" stroke-width="2"/>
  <text x="864" y="444" font-size="12" fill="#e9e2d0" text-anchor="middle">stamp</text>
  <text x="864" y="518" font-size="12" fill="#9aa0a8" text-anchor="middle">fills as chapters clear</text>

  <rect x="0" y="562" width="1024" height="38" fill="#23262d"/>
  <text x="20" y="587" font-size="16" fill="#e8743b">✓ Grow now</text>
  <text x="128" y="587" font-size="16" fill="#e9e2d0">❀ 2</text>
  <text x="430" y="587" font-size="16" fill="#9aa0a8">ready in about 4 min</text>
  <text x="1004" y="587" font-size="16" fill="#e9e2d0" text-anchor="end">← Home</text>
</svg>
