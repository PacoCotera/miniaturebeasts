<text x="916" y="384" font-size="8" fill="#ffe6ad" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">pods leave through the hatch to Pods (right)</text>
<rect x="0" y="562" width="1024" height="38" fill="#23292f" stroke="none" stroke-width="1" rx="0"/>
<rect x="16" y="575" width="16" height="16" fill="#f2671b" stroke="none" stroke-width="0" rx="8"/>
<text x="40" y="588" font-size="16" fill="#f2671b" text-anchor="start" >Take it all in</text>
<text x="512" y="588" font-size="16" fill="#c6c4d8" text-anchor="middle" >any key: the next crate</text>
<text x="1008" y="588" font-size="16" fill="#f1ebdf" text-anchor="end" >Home</text>
<text x="16" y="556" font-size="8" fill="#ffe6ad" text-anchor="start" font-family="DejaVu Sans Mono, monospace">at rest: the bay and the crate only. No pod rack, no well grid, no colour bars, no materials row, no goal line, no world rows</text>
