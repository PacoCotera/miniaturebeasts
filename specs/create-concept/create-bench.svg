<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="600" viewBox="0 0 1024 600" font-family="Inter, Helvetica, Arial, sans-serif">
  <!-- Create concept: the gene bench. 1x wireframe, layout and content only; not a layout spec. -->
  <rect width="1024" height="600" fill="#1d1f24"/>
  <!-- top bar -->
  <rect x="0" y="0" width="1024" height="40" fill="#23262d"/>
  <text x="20" y="26" font-size="20" fill="#e9e2d0">Create</text>
  <text x="430" y="26" font-size="16" fill="#e9e2d0">⚡ 9   ◆ 4   ❀ 6</text>
  <!-- housing and bench surface -->
  <rect x="0" y="40" width="1024" height="522" fill="#7d8f7a"/>
  <rect x="48" y="56" width="928" height="490" rx="18" fill="#3b3631" stroke="#2a2622" stroke-width="4"/>
  <text x="64" y="80" font-size="12" fill="#b9b0a0">BENCH: one matte work surface; everything below sits on it or in it, lit from the top left</text>

  <!-- pod well, left -->
  <circle cx="184" cy="226" r="100" fill="#2a2622" stroke="#9aa79a" stroke-width="6"/>
  <ellipse cx="184" cy="232" rx="58" ry="70" fill="#5b7790" stroke="#c9d3dc" stroke-width="2"/>
  <path d="M130 196 Q184 150 238 196" fill="none" stroke="#e9e2d0" stroke-width="3"/>
  <text x="184" y="236" font-size="12" fill="#e9e2d0" text-anchor="middle">the pod,</text>
  <text x="184" y="252" font-size="12" fill="#e9e2d0" text-anchor="middle">opened</text>
  <rect x="140" y="336" width="88" height="26" rx="4" fill="#4b4741"/>
  <text x="184" y="354" font-size="16" fill="#e9e2d0" text-anchor="middle">Loika</text>
  <text x="184" y="384" font-size="13" fill="#a7a3b8" text-anchor="middle">found at the pond edge</text>

  <!-- the gene line from the pod into the bank -->
  <path d="M108 292 C80 340 80 380 104 420" fill="none" stroke="#6c6a66" stroke-width="8" stroke-linecap="round"/>
  <text x="58" y="300" font-size="11" fill="#b9b0a0">gene line</text>

  <!-- growth dish and founder, centre -->
  <rect x="362" y="70" width="300" height="310" fill="none" stroke="#e9c27a" stroke-width="2" stroke-dasharray="6 4"/>
  <ellipse cx="512" cy="376" rx="196" ry="26" fill="#57603f" stroke="#9aa79a" stroke-width="4"/>
  <ellipse cx="512" cy="370" rx="150" ry="14" fill="#6e7d45"/>
  <ellipse cx="512" cy="232" rx="110" ry="100" fill="#4a4a52" stroke="#e9e2d0" stroke-width="2"/>
  <text x="512" y="222" font-size="16" fill="#e9e2d0" text-anchor="middle">the founder</text>
  <text x="512" y="242" font-size="12" fill="#e9e2d0" text-anchor="middle">300×310, standing on moss</text>
  <text x="512" y="258" font-size="12" fill="#e9e2d0" text-anchor="middle">unread parts frosted</text>
  <!-- the part the focused tumbler drives -->
  <ellipse cx="456" cy="170" rx="36" ry="22" fill="none" stroke="#f0e6c8" stroke-width="3"/>
  <path d="M456 192 L456 404 L250 404 L250 440" fill="none" stroke="#f0e6c8" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="372" y="102" font-size="12" fill="#f0e6c8">the part changes as the drum turns</text>
  <text x="512" y="282" font-size="11" fill="#e9e2d0" text-anchor="middle">growth dish below: moss pad in a shallow cut-out</text>

  <!-- what you changed: paper tag clipped to the bench, right -->
  <rect x="744" y="80" width="192" height="300" rx="6" fill="#e6dcc4" stroke="#8b7f66" stroke-width="2"/>
  <rect x="816" y="72" width="48" height="16" rx="3" fill="#6c6a66"/>
  <text x="760" y="116" font-size="16" fill="#2f2a22">Your changes</text>
  <text x="760" y="146" font-size="14" fill="#2f2a22">Crown: only leafy</text>
  <text x="760" y="168" font-size="14" fill="#2f2a22">Markings: only pale</text>
  <line x1="760" y1="190" x2="920" y2="190" stroke="#8b7f66"/>
  <text x="760" y="216" font-size="16" fill="#2f2a22">Still a surprise</text>
  <text x="760" y="244" font-size="14" fill="#5f574a">Stamina</text>
  <line x1="760" y1="266" x2="920" y2="266" stroke="#8b7f66"/>
  <text x="760" y="292" font-size="14" fill="#5f574a">then to the Incubator</text>
  <text x="760" y="364" font-size="11" fill="#5f574a">paper slip, live text</text>

  <!-- the gene bank: one drum per trait, grouped by chapter -->
  <rect x="72" y="420" width="880" height="116" rx="10" fill="#2a2622" stroke="#9aa79a" stroke-width="3"/>
  <g font-size="12" fill="#e9e2d0">
    <!-- Coat -->
    <text x="92" y="438" fill="#b9b0a0">COAT</text>
    <rect x="92" y="444" width="84" height="84" rx="8" fill="#55625a"/><rect x="100" y="452" width="68" height="68" fill="#d9d0bc"/>
    <rect x="184" y="444" width="84" height="84" rx="8" fill="#55625a" stroke="#f0e6c8" stroke-width="3"/><rect x="192" y="452" width="68" height="68" fill="#d9d0bc"/>
    <!-- Face -->
    <text x="292" y="438" fill="#b9b0a0">FACE</text>
    <rect x="292" y="444" width="84" height="84" rx="8" fill="#55625a"/><rect x="300" y="452" width="68" height="68" fill="#d9d0bc"/>
    <rect x="384" y="444" width="84" height="84" rx="8" fill="#55625a"/><rect x="392" y="452" width="68" height="68" fill="#d9d0bc"/>
    <!-- Movement: breed to change, pinned -->
    <text x="492" y="438" fill="#b9b0a0">MOVEMENT</text>
    <rect x="492" y="444" width="84" height="84" rx="8" fill="#47504a"/><rect x="500" y="452" width="68" height="68" fill="#a9a290"/>
    <circle cx="526" cy="486" r="9" fill="none" stroke="#2f2a22" stroke-width="2"/><circle cx="542" cy="486" r="9" fill="none" stroke="#2f2a22" stroke-width="2"/>
    <!-- Stamina: unread, capped -->
    <text x="600" y="438" fill="#b9b0a0">STAMINA</text>
    <rect x="600" y="444" width="84" height="84" rx="8" fill="#3d4440"/><rect x="608" y="452" width="68" height="68" fill="#6f7a86" opacity="0.6"/>
    <text x="642" y="490" fill="#e9e2d0" text-anchor="middle">frosted</text>
    <!-- room for deeper species -->
    <rect x="708" y="444" width="84" height="84" rx="8" fill="none" stroke="#6c6a66" stroke-dasharray="4 4"/>
    <rect x="800" y="444" width="84" height="84" rx="8" fill="none" stroke="#6c6a66" stroke-dasharray="4 4"/>
    <text x="796" y="438" fill="#8a857a" text-anchor="middle">more traits, more drums</text>
  </g>
  <!-- turn marks on the focused drum -->
  <path d="M218 412 L226 404 L234 412 Z" fill="#f0e6c8"/>
  <text x="196" y="410" font-size="11" fill="#f0e6c8" text-anchor="end">▲▼ turns it</text>
  <text x="900" y="486" font-size="11" fill="#b9b0a0" text-anchor="end">◀▶ next drum</text>

  <!-- bottom line -->
  <rect x="0" y="562" width="1024" height="38" fill="#23262d"/>
  <text x="20" y="587" font-size="16" fill="#e8743b">✓ Grow it</text>
  <text x="110" y="587" font-size="16" fill="#e9e2d0">⚡ 2  ❀ 4  ◆ 2</text>
  <text x="430" y="587" font-size="16" fill="#9aa0a8">Stamina stays a surprise</text>
  <text x="1004" y="587" font-size="16" fill="#e9e2d0" text-anchor="end">← Loika</text>
</svg>
