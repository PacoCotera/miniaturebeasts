<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>2c the card turns over (phone)</title><link rel="stylesheet" href="lab.css"></head>
<body class="phone" data-note="The card turns over; ink lands on Bramble's Crown and on what any child of Tita and Bramble must hide.">
<div id="screen">
  <div class="head" style="height:26px"><b data-w="head.bench"></b><span class="sp"></span><span class="dim" style="font-size:10.5px" data-w="head.time.first2"></span></div>
  <div id="board" data-chain="bramble>child@40">
    <div class="card" id="tita" data-name="Tita" data-tag="tag.yours.grown" style="left:6px;top:30px"
      data-t="open:v.plain.open, ink:v.bare, open:v.eyes.open, open:v.open, open:v.open"></div>
    <div class="card wild focus" id="bramble" data-name="Bramble" data-tag="tag.wild.marsh" style="left:6px;top:130px"
      data-t="open:v.plain.open, ink:v.crest.carries new, open:v.eyes.open, open:v.open, open:v.open"></div>
    <div id="child" style="position:absolute;left:6px;top:240px;width:150px;border:1.5px dashed var(--g4);border-radius:6px;padding:3px 5px;background:#fff">
      <div style="font-size:9.5px;color:var(--g4);margin-bottom:2px;white-space:nowrap" data-w="answer.pair"></div>
      <div class="tr"><div class="tl" style="width:34px" data-w="trait.crown"></div><div class="tv ink new" style="font-size:9.5px" data-w="answer.child.crested"></div></div>
      <div class="tr"><div class="tl" style="width:34px"></div><div class="tv pencil" data-w="v.bare.pencil.1in2"></div></div>
    </div>
    <div class="panel" style="left:162px;top:30px;width:150px;height:318px;border:2px solid var(--g5);padding:8px 9px">
      <div class="dim" style="font-size:10.5px;margin-bottom:4px" data-w="answer.title"></div>
      <h3 style="font-size:14px;line-height:18px;color:var(--ink)" data-w="answer.text"></h3>
      <p style="font-size:11px;line-height:14.5px" data-w="answer.spread"></p>
      <div class="stamp" style="left:9px;bottom:9px;right:9px;font-size:11px;line-height:14px;color:var(--g5);font-weight:500" data-w="answer.first"></div>
    </div>
  </div>
</div>
<script type="module" src="lab.js"></script>
</body></html>
