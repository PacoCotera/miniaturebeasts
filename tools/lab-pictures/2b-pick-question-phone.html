<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>2b pick the question (phone)</title><link rel="stylesheet" href="lab.css">
<style>.opt { font-size: 12px; padding: 6px 8px; margin-bottom: 6px; line-height: 15px; } .opt .kind { font-size: 10.5px; }</style></head>
<body class="phone" data-note="One sample, one question. The third kind of question needs a different sample, shown but not open.">
<div id="screen">
  <div class="head" style="height:26px"><b data-w="head.bench"></b><span class="sp"></span><span class="dim" style="font-size:10.5px" data-w="head.time.first"></span></div>
  <div class="panel" style="left:6px;top:34px;width:306px;height:314px;border:2px solid var(--g5);padding:10px 10px">
    <h3 style="font-size:15px;line-height:19px" data-w="ask.title"></h3>
    <p class="dim" style="font-size:11px;line-height:14px" data-w="ask.sub"></p>
    <div class="opt on"><i class="dot"></i><span><span data-w="ask.crown"></span><span class="kind" data-w="ask.crown.kind"></span></span></div>
    <div class="opt"><i class="dot"></i><span><span data-w="ask.eyes"></span><span class="kind" data-w="ask.eyes.kind"></span></span></div>
    <div class="opt off"><i class="dot"></i><span><span data-w="ask.drive"></span><span class="kind" data-w="ask.drive.kind"></span></span></div>
    <div style="position:absolute;right:10px;bottom:10px"><span class="btn" data-w="ask.button"></span></div>
  </div>
</div>
<script type="module" src="lab.js"></script>
</body></html>
