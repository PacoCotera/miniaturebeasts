<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>3 a trait seen at home (phone)</title><link rel="stylesheet" href="lab.css"></head>
<body class="phone" data-note="A wild one's last open trait, inked by what it did at home the first time; no goal needed.">
<div id="screen">

  <div id="board">
    <div class="box" style="left:6px;top:32px;width:306px;height:124px"></div>

    <div class="box" style="left:150px;top:118px;width:46px;height:28px;background:#fff;border:1.5px solid var(--g5);color:var(--g5);font-weight:600;font-size:10.5px" data-w="home.slot.sorrel"></div>

      <path d="M222,99 L240,82" stroke="#6b6b68" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/><circle cx="244" cy="78" r="2.2" fill="#6b6b68"/>

    <p style="position:absolute;left:8px;top:160px;width:302px;font-size:11.5px;line-height:15px;font-weight:500" data-w="home.title"></p>
    <div class="card wild focus" id="sorrel" data-name="Sorrel" data-tag="tag.wild.brook" style="left:6px;top:196px"

    <div class="pop" style="left:6px;top:300px;width:306px;font-size:11px;line-height:14px;padding:5px 7px"><span class="k">Sorrel · <span data-w="trait.drive"></span></span><span data-w="home.ink"></span></div>
  </div>
</div>
