<!doctype html>
<html><head><meta charset="utf-8"><title>2b pick the question (Station)</title><link rel="stylesheet" href="lab.css"></head>
<body class="station"><div id="screen">
  <div class="head"><b data-w="head.station"></b><span data-w="head.bench"></span><span class="sp"></span><span class="draft" data-w="draft"></span><span class="dim" data-w="head.time.first"></span></div>
  <div class="goal"><span class="gl" data-w="goal.label"></span><span data-w="goal.text"></span><span class="bar"><i style="width:0"></i></span></div>
  <div id="board">
    <div class="card faded" id="tita" data-name="Tita" data-tag="tag.yours.grown" style="left:16px;top:76px"
      data-t="open:v.plain.open, ink:v.bare, open:v.eyes.open, open:v.open, open:v.open"></div>
    <div class="card wild focus" id="bramble" data-name="Bramble" data-tag="tag.wild.marsh" style="left:16px;top:206px"
      data-t="open:v.plain.open, open:v.crest.open, open:v.eyes.open, open:v.open, open:v.open"></div>
    <div class="panel" style="left:236px;top:76px;width:540px;height:300px;border:2px solid var(--g5)">
      <h3 style="font-size:18px" data-w="ask.title"></h3>
      <p class="dim" data-w="ask.sub"></p>
      <div class="opt on"><i class="dot"></i><span><span data-w="ask.crown"></span><span class="kind" data-w="ask.crown.kind"></span></span></div>
      <div class="opt"><i class="dot"></i><span><span data-w="ask.eyes"></span><span class="kind" data-w="ask.eyes.kind"></span></span></div>
      <div class="opt off"><i class="dot"></i><span><span data-w="ask.drive"></span><span class="kind" data-w="ask.drive.kind"></span></span></div>
      <div style="position:absolute;right:16px;bottom:14px"><span class="btn" data-w="ask.button"></span></div>
    </div>
  </div>
</div>
<script type="module" src="lab.js"></script>
</body></html>
