<!doctype html>
<html><head><meta charset="utf-8"><title>2c the card turns over (Station)</title><link rel="stylesheet" href="lab.css"></head>
<body class="station"><div id="screen">
  <div class="head"><b data-w="head.station"></b><span data-w="head.bench"></span><span class="sp"></span><span class="draft" data-w="draft"></span><span class="dim" data-w="head.time.first2"></span></div>
  <div class="goal"><span class="gl" data-w="goal.label"></span><span data-w="goal.text"></span><span class="bar"><i style="width:0"></i></span></div>
  <div id="board" data-chain="bramble>child@104">
    <div class="card" id="tita" data-name="Tita" data-tag="tag.yours.grown" style="left:16px;top:76px"
      data-t="open:v.plain.open, ink:v.bare, open:v.eyes.open, open:v.open, open:v.open"></div>
    <div class="card wild focus" id="bramble" data-name="Bramble" data-tag="tag.wild.marsh" style="left:16px;top:206px"
      data-t="open:v.plain.open, ink:v.crest.carries new, open:v.eyes.open, open:v.open, open:v.open"></div>
    <div id="child" style="position:absolute;left:16px;top:346px;width:206px;border:1.5px dashed var(--g4);border-radius:6px;padding:5px 7px;background:#fff">
      <div style="font-size:11px;color:var(--g4);margin-bottom:3px" data-w="answer.pair"></div>
      <div class="tr"><div class="tl" data-w="trait.crown"></div><div class="tv ink new" data-w="answer.child.crested"></div></div>
      <div class="tr"><div class="tl"></div><div class="tv pencil" data-w="v.bare.pencil.1in2"></div></div>
    </div>
    <div class="panel" style="left:236px;top:76px;width:540px;height:300px;border:2px solid var(--g5)">
      <div class="dim" style="font-size:12px;margin-bottom:8px" data-w="answer.title"></div>
      <div class="row" style="align-items:flex-start;gap:14px">
        <div class="box" style="position:static;width:120px;height:120px;flex:none">whisker</div>
        <div>
          <h3 style="font-size:20px;color:var(--ink)" data-w="answer.text"></h3>
          <p data-w="answer.spread"></p>
        </div>
      </div>
      <div class="stamp" style="left:16px;bottom:16px;font-size:12.5px;color:var(--g5);font-weight:500" data-w="answer.first"></div>
    </div>
  </div>
</div>
<script type="module" src="lab.js"></script>
</body></html>
