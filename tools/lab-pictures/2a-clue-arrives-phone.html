<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>2a a clue card arrives (phone)</title><link rel="stylesheet" href="lab.css"></head>
<body class="phone" data-note="The first sample of the first expedition: sent home at once, so the first ink lands within 10 minutes.">
<div id="screen">
  <div class="head" style="height:26px"><b data-w="head.bench"></b><span class="sp"></span><span class="dim" style="font-size:10.5px" data-w="head.time.first"></span></div>
  <div class="panel" style="left:6px;top:34px;width:306px;height:314px;border:2px solid var(--g5);padding:10px 12px">
    <div class="dim" style="font-size:11.5px;margin-bottom:8px" data-w="first.banner"></div>
    <div class="row" style="align-items:flex-start;gap:10px">
      <div class="box" style="position:static;width:64px;height:64px;flex:none;font-size:10px">whisker</div>
      <h3 style="font-size:17px;line-height:21px" data-w="first.card.title"></h3>
    </div>
    <p style="font-size:12px;line-height:16px;margin-top:10px" data-w="first.card.how"></p>
    <p style="font-size:12px;line-height:16px" data-w="first.card.when"></p>
    <p style="font-size:12px;line-height:16px;font-weight:500" data-w="first.card.ready"></p>
    <div style="position:absolute;right:12px;bottom:12px"><span class="btn" data-w="first.card.button"></span></div>
  </div>
</div>
<script type="module" src="lab.js"></script>
</body></html>
