name: Exploration tests

# The game's walk, place, land and save tests (prototypes/exploration/tests/*.test.mjs), split into shards that each stay under about 10 minutes
# (.github/exploration-tests.sh holds the groups and why). Runs when the game, its places or this workflow change.
on:
  pull_request:
    paths:
      - "prototypes/exploration/**"
      - "prototypes/places/**"
      - "prototypes/station/**"
      - "art/companion-48/**"
      - ".github/exploration-tests.sh"
      - ".github/ci-load.mjs"
      - ".github/workflows/exploration-tests.yml"
  push:
    branches: [main]
    paths:
      - "prototypes/exploration/**"
      - "prototypes/places/**"
      - "prototypes/station/**"
      - "art/companion-48/**"
      - ".github/exploration-tests.sh"
      - ".github/workflows/exploration-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('explore-pr-{0}', github.event.pull_request.number) || format('explore-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shard:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository   # never a fork on the dev server
    runs-on: [self-hosted, mb-dev]   # the dev server
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [views-agree-1, views-agree-2, views-agree-3, hold, place, decor, heavy, rest-a, rest-b]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Packages (the generator's noise and queue; the places' own)
        run: |
          set -euo pipefail
          npm ci --prefix prototypes/exploration --no-audit --no-fund --silent
          npm ci --prefix prototypes/places --no-audit --no-fund --silent
      - name: The shard
        run: sh .github/exploration-tests.sh "${{ matrix.group }}"

  # Files that fail today for a decision that is not a test fix (the list and the reasons are in .github/exploration-tests.sh). They run so their state shows; they do not block.
  pending:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mb-dev]
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Packages
        run: |
          set -euo pipefail
          npm ci --prefix prototypes/exploration --no-audit --no-fund --silent
          npm ci --prefix prototypes/places --no-audit --no-fund --silent
      - name: The pending files
        run: sh .github/exploration-tests.sh pending
