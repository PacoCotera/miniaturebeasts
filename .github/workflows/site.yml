name: Sandbox

on:
  push:
    branches: [main]
    paths: ['website/**', 'prototypes/**', 'art/companion-48/terrain/**', 'art/places/**', 'v1/native/vendor/lvgl/**', 'ops/sandbox/**', 'ops/ledger/**', '.github/workflows/site.yml', '.github/smoke.mjs', '.github/roadmap.test.mjs']
  pull_request:
    # The release check holds before a merge, not after it, on every pull request into main, whatever it touches: the Sandbox `build` check is one main requires, and so is `browser`.
    # The release and the gh-pages steps below run on main only.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # one group per workflow and ref: a pull request's runs (refs/pull/N/merge) queue and a new push cancels the older one; main's runs and deploys queue on main's ref and are never cancelled; a dispatch on a branch queues on that branch and no longer shares main's group
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# THE RELEASE CHECK (owner 2026-11-11 11:00): a pull request into main runs the small check only, about five minutes, and nothing else:
#   `build`    the Station's face, the site assembly, the pages parse and every page opens in a browser (.github/smoke.mjs); the public guard is its own workflow (public-guard.yml)
#   `browser`  one play-through per page, one after the other (.github/release-check.sh): the Companion's first expedition, the Station (a crate carried home, Pods, Create, Grow, the hatch) with its layer checks, the play page's dock round trip, the test page's switch and dock
# Every other test stays in the repository: a builder runs the ones for what they changed (design/proposals/station-build.md §5); no full suite runs here and no nightly run exists.

jobs:
  build:
    # The project's own dev server (owner 2026-11-10: the tests run there, not on GitHub's machines). Its system tools (ninja, bc, Chromium's libraries) are installed once on the server, so the install lines below run only on a GitHub machine. Never for a pull request from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mb-dev]
    timeout-minutes: 30   # the limit only catches a hung run
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          # Only what the build reads (13.5 minutes for the whole tree on 2026-10-28, most of it art/ and v1/): the build's own folders, and the
          # folders the build and the journeys read outside them (.github/build-reads.txt, and the palettes the layer checks read); root files come with cone mode.
          # Left out: the concept art (about 600 MB) and v1/ beyond the vendored LVGL and the generator workbench. A new folder the build or a journey reads is added here and in `browser`.
          sparse-checkout: |
            .github
            website
            prototypes
            ops
            design
            hardware
            v1/native/vendor
            v1/native/shared/fonts
            art/companion-48
            art/places
            art/device-buttons
            art/station-masters
            art/retro-diffusion-trial
      - name: Scope (a pull request that changes only documents skips the build)
        # .github/docs-only.sh takes the pull request's changed files and applies the three conditions (a .md, outside the build's own folders, not read by the build). A push to main and a manual run never skip.
        # The job still ends green under the same name, so the required check passes. Every step below carries the condition.
        id: scope
        run: |
          set -u
          result=docs=false
          list=
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if list=$(git diff --name-status --no-renames HEAD^1 HEAD); then
              result=$(printf '%s\n' "$list" | sh .github/docs-only.sh) || result=docs=false
            fi
          fi
          echo "$result" >> "$GITHUB_OUTPUT"
          { echo "Docs-only: $result"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" = docs=true ]; then
            { echo "Documents only: the build was skipped. Changed files:"; printf '%s\n' "$list" | cut -f2 | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Emscripten SDK (pinned in prototypes/face/emsdk.version)
        if: steps.scope.outputs.docs != 'true'
        # The Station's face is LVGL in C, built for the sandbox as WebAssembly (technical-architecture.md §8). The SDK
        # (about 1 GB installed) is cached by its pinned version.
        id: emsdk
        run: echo "version=$(cat prototypes/face/emsdk.version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        # On the dev server ~/emsdk stays between runs and is shared by the runners (the `browser` job compiles with it too): a cache restore would write over files in use. So the cache is for GitHub's machines only.
        if: steps.scope.outputs.docs != 'true' && runner.environment != 'self-hosted'
        with:
          path: ~/emsdk
          key: emsdk-${{ steps.emsdk.outputs.version }}-ubuntu-24.04
      - name: Build the Station's face (LVGL 9.6 to WebAssembly, and native Linux)
        if: steps.scope.outputs.docs != 'true'
        # Build time and sizes are printed in the log. The face is built before the site is assembled so that
        # prototypes/face/dist travels with the sandbox bundle.
        # FACE_BUILD_DIR: the build's own folder in this job's temp, as the `browser` job has, so jobs on the same machine never share /tmp/mb-face-build.
        run: |
          set -euo pipefail
          if [ "$RUNNER_ENVIRONMENT" != self-hosted ]; then sudo apt-get install -y -q ninja-build bc >/dev/null; fi
          exec 9>"$HOME/.emsdk.lock"; flock 9   # the dev server shares ~/emsdk between jobs: one setup at a time (two activates at once lost .emscripten)
          if [ ! -f "$HOME/emsdk/emsdk" ]; then git clone --depth 1 --branch "$(cat prototypes/face/emsdk.version)" https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"; fi
          (cd "$HOME/emsdk" && ./emsdk install "${{ steps.emsdk.outputs.version }}" >/dev/null && ./emsdk activate "${{ steps.emsdk.outputs.version }}" >/dev/null)
          flock -u 9
          FACE_BUILD_DIR="$RUNNER_TEMP/face-build" EMSDK="$HOME/emsdk" prototypes/face/build.sh all
      - name: Assemble the site
        if: steps.scope.outputs.docs != 'true'
        run: |
          set -euo pipefail
          mkdir -p _site/sandbox
          cp -r website/. _site/
          for p in prototypes/*/; do
            n=$(basename "$p")
            mkdir -p "_site/sandbox/$n"
            cp -r "$p". "_site/sandbox/$n/"
          done
          mkdir -p _site/ops && cp -r ops/ledger _site/ops/
          # the web server's Caddyfile and the studio login's code travel in the release: deploy.sh checks the Caddyfile before it goes live, the login unit runs from the release
          mkdir -p _site/ops/sandbox/login && cp ops/sandbox/Caddyfile _site/ops/sandbox/ && cp ops/sandbox/login/mb_login.py ops/sandbox/login/mb-studio-passwd _site/ops/sandbox/login/
          # the Companion's 48 px place art, from where it lives: the shipping folder only (sheets, palette and manifest)
          mkdir -p _site/art/companion-48/terrain && cp -r art/companion-48/terrain/meadow _site/art/companion-48/terrain/
          printf '{"commit":"%s","short":"%s","built":"%s"}\n' "$GITHUB_SHA" "${GITHUB_SHA:0:7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/build.json
      - name: Install the exploration page's packages (the generator's noise and queue)
        if: steps.scope.outputs.docs != 'true'
        run: npm ci --prefix prototypes/exploration --no-audit --no-fund --silent
      - name: Bundle the pages (Vite)
        if: steps.scope.outputs.docs != 'true'
        # prototypes/vite.config.mjs bundles the Station, play and exploration pages into content-hashed chunks with modulepreload (the spec JSON and p-queue inside, the pictures and metrics hashed) and
        # lays them over _site/sandbox: the three pages are replaced, /sandbox/assets/ is added (ops/sandbox/Caddyfile keeps it immutable), every source file stays where it was. npm ci installs the
        # pinned vite and p-queue (prototypes/package-lock.json); the journeys import the sources and use the same install. Measured: about 3 s for the build.
        run: sh ops/sandbox/bundle-pages.sh _site
      - name: Check the pages parse
        if: steps.scope.outputs.docs != 'true'
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'),os=require('os'),path=require('path'),{execFileSync}=require('child_process');const tmp=fs.mkdtempSync(path.join(os.tmpdir(),'parse-'));let n=0;
          for(const f of process.argv.slice(1)){const s=fs.readFileSync(f,'utf8');for(const m of s.matchAll(/<script(?![^>]*src)([^>]*)>([\s\S]*?)<\/script>/g)){
           if(/type=[\"']module[\"']/.test(m[1])){const t=path.join(tmp,(n++)+'.mjs');fs.writeFileSync(t,m[2]);execFileSync(process.execPath,['--check',t],{stdio:'inherit'});}else new Function(m[2]);}}
          console.log('scripts parse')" $(find _site -name '*.html')
      - name: Playwright's Chromium (cached by the Playwright version)
        if: steps.scope.outputs.docs != 'true'
        # The browser download was the one step whose time varied (30 s to 2 m 35 s). The key's 1.56.1 moves with playwright@1.56.1 below.
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pw
          key: playwright-1.56.1-chromium-ubuntu-24.04-${{ runner.arch }}
      - name: Every page opens in a browser (the home page, the roadmap, the Companion, the Station, the play page, the test page)
        if: steps.scope.outputs.docs != 'true'
        # .github/smoke.mjs loads each page of the assembled site headless and fails on a page error or a console error, a missing build stamp or the face missing from the bundle.
        run: |
          set -euo pipefail
          (cd _site && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 1
          npm --prefix "$RUNNER_TEMP" install --silent playwright@1.56.1
          if [ "$RUNNER_ENVIRONMENT" != self-hosted ]; then time npx --prefix "$RUNNER_TEMP" playwright install-deps chromium >/dev/null; fi
          time PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw" npx --prefix "$RUNNER_TEMP" playwright install chromium >/dev/null
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw" PW_DIR="$RUNNER_TEMP" node .github/smoke.mjs
      - name: Publish the tested bundle as a release
        if: github.ref == 'refs/heads/main' && steps.scope.outputs.docs != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -C _site -czf "sandbox-${GITHUB_SHA:0:7}.tar.gz" .
          sha256sum "sandbox-${GITHUB_SHA:0:7}.tar.gz" > "sandbox-${GITHUB_SHA:0:7}.sha256"
          tag="sandbox-${GITHUB_SHA:0:7}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "Sandbox $tag" \
            --notes "Tested site + prototypes at $GITHUB_SHA. The sandbox server installs the newest sandbox-* release." \
            "sandbox-${GITHUB_SHA:0:7}.tar.gz" "sandbox-${GITHUB_SHA:0:7}.sha256"
      - name: Keep only the five newest sandbox releases
        # Every push to main adds a bundle of 100+ MB; nothing ever removed them.
        # The sandbox server keeps its last five installs, so five on GitHub matches it.
        if: github.ref == 'refs/heads/main' && steps.scope.outputs.docs != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 500 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("sandbox-"))] | sort_by(.createdAt) | reverse | .[5:][].tagName' |
          while read -r tag; do
            echo "pruning $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
      - name: Push the same bundle to the gh-pages branch (temporary mirror)
        if: github.ref == 'refs/heads/main' && steps.scope.outputs.docs != 'true'
        run: |
          set -euo pipefail
          touch _site/.nojekyll
          # the copied prototypes carry their own .gitignore files (prototypes/face/.gitignore ignores dist/), which git add would honour
          find _site -name .gitignore -delete
          cd _site
          git init -q -b gh-pages
          git config user.name "sandbox-ci"
          git config user.email "sandbox-ci@users.noreply.github.com"
          git add -A
          git commit -qm "Sandbox mirror of ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  browser:
    # One play-through per page, in one job, one after the other (.github/release-check.sh; measured about 4 minutes of journeys on the dev server). Beside `build`, it does not wait for it.
    # Scope: documents only, or a change no journey reads (.github/ci-filter.sh says all three false: a change under website/ only), skips every step and the job still ends green; a push to main runs none; a manual run runs it.
    # The tools are set up in places the runner's user can read: the Emscripten SDK in the runner's own ~/emsdk (cloned and installed on first use, shared by its runs), Playwright 1.56.1 and its Chromium under $RUNNER_TEMP/pw. Nothing is read from /home/mb.
    # A browser that cannot start fails the step: every step runs with set -e and the journeys throw when chromium.launch fails; no step here turns that into a skip.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mb-dev]
    timeout-minutes: 20   # the limit only catches a hung run
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          # The same list as `build` (the journeys read the same folders).
          sparse-checkout: |
            .github
            website
            prototypes
            ops
            design
            hardware
            v1/native/vendor
            v1/native/shared/fonts
            art/companion-48
            art/places
            art/device-buttons
            art/station-masters
            art/retro-diffusion-trial
      - name: Scope (documents only, or a change no journey reads, skips the job)
        id: scope
        run: |
          set -u
          result=docs=false
          filter=run=true
          case $GITHUB_EVENT_NAME in
            push) filter=run=false ;;
            pull_request)
              if list=$(git diff --name-status --no-renames HEAD^1 HEAD); then
                result=$(printf '%s\n' "$list" | sh .github/docs-only.sh) || result=docs=false
              fi
              if names=$(git diff --name-only --no-renames HEAD^1 HEAD); then
                all=$(printf '%s\n' "$names" | sh .github/ci-filter.sh) || all=
                if [ -n "$all" ] && ! printf '%s\n' "$all" | grep -q '=true'; then filter=run=false; fi
              fi ;;
          esac
          echo "$result" >> "$GITHUB_OUTPUT"
          echo "$filter" >> "$GITHUB_OUTPUT"
          echo "Browser: docs-only $result; $filter" >> "$GITHUB_STEP_SUMMARY"
      - name: Emscripten SDK (pinned in prototypes/face/emsdk.version)
        if: steps.scope.outputs.docs != 'true' && steps.scope.outputs.run == 'true'
        id: emsdk
        run: echo "version=$(cat prototypes/face/emsdk.version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        # GitHub's machines only, as in `build`: ~/emsdk stays on the dev server and is shared by the runners.
        if: steps.scope.outputs.docs != 'true' && steps.scope.outputs.run == 'true' && runner.environment != 'self-hosted'
        with:
          path: ~/emsdk
          key: emsdk-${{ steps.emsdk.outputs.version }}-ubuntu-24.04
      - name: Build the Station's face (the journeys read its dist folder)
        if: steps.scope.outputs.docs != 'true' && steps.scope.outputs.run == 'true'
        # The same commands as in `build`.
        run: |
          set -euo pipefail
          if [ "$RUNNER_ENVIRONMENT" != self-hosted ]; then sudo apt-get install -y -q ninja-build bc >/dev/null; fi
          exec 9>"$HOME/.emsdk.lock"; flock 9   # the dev server shares ~/emsdk between jobs: one setup at a time (two activates at once lost .emscripten)
          if [ ! -f "$HOME/emsdk/emsdk" ]; then git clone --depth 1 --branch "$(cat prototypes/face/emsdk.version)" https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"; fi
          (cd "$HOME/emsdk" && ./emsdk install "$(cat "$GITHUB_WORKSPACE/prototypes/face/emsdk.version")" >/dev/null && ./emsdk activate "$(cat "$GITHUB_WORKSPACE/prototypes/face/emsdk.version")" >/dev/null)
          flock -u 9
          FACE_BUILD_DIR="$RUNNER_TEMP/face-build" EMSDK="$HOME/emsdk" prototypes/face/build.sh all
      - name: Install the pages' packages (vite, p-queue)
        if: steps.scope.outputs.docs != 'true' && steps.scope.outputs.run == 'true'
        run: npm ci --prefix prototypes --no-audit --no-fund --silent
      - name: Playwright's Chromium (cached by the Playwright version)
        if: steps.scope.outputs.docs != 'true' && steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pw
          key: playwright-1.56.1-chromium-ubuntu-24.04-${{ runner.arch }}
      - name: Install Playwright and its Chromium
        if: steps.scope.outputs.docs != 'true' && steps.scope.outputs.run == 'true'
        # The journeys find it through PW_DIR and PLAYWRIGHT_BROWSERS_PATH, set for the steps after this one.
        run: |
          set -euo pipefail
          npm --prefix "$RUNNER_TEMP" install --silent playwright@1.56.1
          if [ "$RUNNER_ENVIRONMENT" != self-hosted ]; then npx --prefix "$RUNNER_TEMP" playwright install-deps chromium >/dev/null; fi
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw" npx --prefix "$RUNNER_TEMP" playwright install chromium >/dev/null
          echo "PW_DIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw" >> "$GITHUB_ENV"
      - name: Places toolchain (pinned flatc, npm ci)
        if: steps.scope.outputs.docs != 'true' && steps.scope.outputs.run == 'true'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sh prototypes/places/tools/get-flatc.sh "$RUNNER_TEMP/flatc"
          echo "$RUNNER_TEMP/flatc" >> "$GITHUB_PATH"
          npm ci --prefix prototypes/places --no-audit --no-fund
          npm ci --prefix prototypes/exploration --no-audit --no-fund
      - name: The play-throughs (one per page, one after the other)
        if: steps.scope.outputs.docs != 'true' && steps.scope.outputs.run == 'true'
        timeout-minutes: 10   # measured about 4 minutes
        # .github/release-check.sh: the Companion's first expedition, the Station's journey and layer checks, the play page's dock round trip, the test page's switch and dock. It prints the seconds each took.
        run: sh .github/release-check.sh
