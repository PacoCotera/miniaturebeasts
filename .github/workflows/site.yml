name: Sandbox

on:
  push:
    branches: [main]
    paths: ['website/**', 'prototypes/**', 'v1/native/vendor/lvgl/**', 'ops/sandbox/**', 'ops/ledger/**', '.github/workflows/site.yml', '.github/smoke.mjs']
  pull_request:
    # The gates hold before a merge, not after it (lvgl-switch.md §6 Q2 v), on every pull request into main, whatever it touches: the Sandbox `build` check is one main will require.
    # The release and the gh-pages steps below run on main only.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # a pull request's runs queue by number and a new push cancels the older run; a main run, a dispatch and a deploy share one group and are never cancelled
  group: ${{ github.event_name == 'pull_request' && format('sandbox-pr-{0}', github.event.pull_request.number) || 'sandbox' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Emscripten SDK (pinned in prototypes/face/emsdk.version)
        # The Station's face is LVGL in C, built for the sandbox as WebAssembly (technical-architecture.md §8). The SDK
        # (about 1 GB installed) is cached by its pinned version.
        id: emsdk
        run: echo "version=$(cat prototypes/face/emsdk.version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ steps.emsdk.outputs.version }}-ubuntu-24.04
      - name: Build the Station's face (LVGL 9.6 to WebAssembly, and native Linux)
        # Build time and sizes are printed in the log. The face is built before the site is assembled so that
        # prototypes/face/dist travels with the sandbox bundle.
        run: |
          set -euo pipefail
          sudo apt-get install -y -q ninja-build bc >/dev/null
          if [ ! -f "$HOME/emsdk/emsdk" ]; then git clone --depth 1 --branch "$(cat prototypes/face/emsdk.version)" https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"; fi
          (cd "$HOME/emsdk" && ./emsdk install "${{ steps.emsdk.outputs.version }}" >/dev/null && ./emsdk activate "${{ steps.emsdk.outputs.version }}" >/dev/null)
          EMSDK="$HOME/emsdk" prototypes/face/build.sh all
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site/sandbox
          cp -r website/. _site/
          for p in prototypes/*/; do
            n=$(basename "$p")
            mkdir -p "_site/sandbox/$n"
            cp -r "$p". "_site/sandbox/$n/"
          done
          mkdir -p _site/ops && cp -r ops/ledger _site/ops/
          printf '{"commit":"%s","short":"%s","built":"%s"}\n' "$GITHUB_SHA" "${GITHUB_SHA:0:7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/build.json
      - name: Check the pages parse
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');for(const f of process.argv.slice(1)){const s=fs.readFileSync(f,'utf8');for(const m of s.matchAll(/<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/g)){new Function(m[1]);}}console.log('scripts parse')" $(find _site -name '*.html')
      - name: Smoke-test in a browser
        run: |
          set -euo pipefail
          (cd _site && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 1
          npm --prefix "$RUNNER_TEMP" install --silent playwright@1.49.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw" npx --prefix "$RUNNER_TEMP" playwright install --with-deps chromium >/dev/null
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw" PW_DIR="$RUNNER_TEMP" node .github/smoke.mjs
      - name: Freeze check (the JavaScript drawing layer)
        # prototypes/face/deprecated.json lists every deprecated drawing module with its hash and the files allowed to import it (lvgl-switch.md §5.1):
        # a listed file may not change, no new file may import one, no registered screen may gain draw, nodes or faceNodes, and a path leaves the list
        # only with its file's deletion or its screen's goldens. Exemptions are printed on every run.
        # The checkout keeps no credentials, so the base is fetched with the job's token on the command line, as the publish steps below do. On a push the base is the commit
        # before the push; on a pull request and on dispatch it is main.
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git fetch --no-tags --depth=1 "$url" "$BEFORE"
            BASE="$BEFORE"
          else
            git fetch --no-tags --depth=1 "$url" main:refs/remotes/origin/main
            BASE=origin/main
          fi
          node prototypes/face/tools/freeze-check.mjs --base "$BASE"
      - name: Station rules and journey
        timeout-minutes: 12   # the step takes about 2.5 minutes; a hang fails fast instead of holding the runner for the job's six hours
        # The Station's rules and the Caddy service in Node, and the Station's browser journey with the service
        # in mock mode beside it (a fixture save, a seeded pod, dock, identify, read, compare, return, grow, open,
        # the painting landing, the service down and back); station-build.md §5.
        run: |
          set -euo pipefail
          node --test prototypes/ui/tests/*.test.mjs prototypes/station/tests/*.test.mjs prototypes/caddy/tests/*.test.mjs prototypes/face/tests/*.test.mjs
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw" PW_DIR="$RUNNER_TEMP" node prototypes/station/tools/journey.mjs
      - name: Placed masters match their index
        # Every master placed in prototypes/ui/assets/masters (by ui/tools/place-masters.mjs) is checked against its index entry: file present, size, SHA-256.
        run: node prototypes/ui/tools/place-masters.mjs --check
      - name: Station face fonts re-baked and compared
        # The face's Inter fonts are generated C (prototypes/face/src/fonts) from the committed TrueType files by lv_font_conv,
        # pinned here to the version the sources were baked with; the bake is reproducible, so a diff means the sources or the
        # script changed without the fonts being re-baked.
        run: |
          npm install --prefix "$RUNNER_TEMP/lvfc" lv_font_conv@1.5.3
          sh prototypes/face/tools/bake-fonts.sh "$RUNNER_TEMP/lvfc/node_modules/.bin/lv_font_conv"
          git diff --exit-code -- prototypes/face/src/fonts
      - name: Station face in a browser (LVGL)
        # The page with ?face=lvgl loads the WebAssembly face: LVGL 9.6.0, a 1024×600 display, keys in, the same pixels as
        # the native Linux build; the load time, the size on the wire and the cost of a full-frame copy (CPU throttled
        # 4× as a phone's stand-in) are printed.
        run: PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw" PW_DIR="$RUNNER_TEMP" node prototypes/face/tools/face-check.mjs
      - name: Station frame in LVGL
        # The top bar, the bottom line, the message plate and the focus ring as LVGL objects: the rules, the separators and the
        # ground from the frame spec, where each text run's ink lies against the canvas renderer's, the ring in the focus role,
        # the plate and the counter's tick; no node refused. The captures it checks are written to prototypes/face/img.
        run: PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw" PW_DIR="$RUNNER_TEMP" node prototypes/face/tools/frame-check.mjs
      - name: Station layer checks
        # What the journey recorded at each screenshot point, measured and printed (technical-architecture.md §5.6):
        # the art layer at exactly 0 off-palette pixels; the type layer's run log (every string Inter at 16, 20 or 28 px
        # from the bundled atlases, no text API call); every drawn region's box against its spec file; the stamp label
        # at 120 and the rail's tab count against the frame.
        run: |
          set -euo pipefail
          node prototypes/station/tools/checks.mjs
      - name: Publish the tested bundle as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -C _site -czf "sandbox-${GITHUB_SHA:0:7}.tar.gz" .
          sha256sum "sandbox-${GITHUB_SHA:0:7}.tar.gz" > "sandbox-${GITHUB_SHA:0:7}.sha256"
          tag="sandbox-${GITHUB_SHA:0:7}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "Sandbox $tag" \
            --notes "Tested site + prototypes at $GITHUB_SHA. The VM installs the newest sandbox-* release." \
            "sandbox-${GITHUB_SHA:0:7}.tar.gz" "sandbox-${GITHUB_SHA:0:7}.sha256"
      - name: Keep only the five newest sandbox releases
        # Every push to main adds a bundle of 100+ MB; nothing ever removed them.
        # The VM keeps its last five installs, so five on GitHub matches it.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 500 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("sandbox-"))] | sort_by(.createdAt) | reverse | .[5:][].tagName' |
          while read -r tag; do
            echo "pruning $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
      - name: Push the same bundle to the gh-pages branch (temporary mirror)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "sandbox-ci"
          git config user.email "sandbox-ci@users.noreply.github.com"
          git add -A
          git commit -qm "Sandbox mirror of ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
