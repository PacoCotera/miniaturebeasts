name: Sandbox

on:
  push:
    branches: [main]
    paths: ['website/**', 'prototypes/**', 'art/companion-48/terrain/**', 'v1/native/vendor/lvgl/**', 'ops/sandbox/**', 'ops/ledger/**', '.github/workflows/site.yml', '.github/smoke.mjs', '.github/roadmap.test.mjs']
  pull_request:
    # The gates hold before a merge, not after it, on every pull request into main, whatever it touches: the Sandbox `build` check is one main will require.
    # The release and the gh-pages steps below run on main only.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # one group per workflow and ref: a pull request's runs (refs/pull/N/merge) queue and a new push cancels the older one; main's runs and deploys queue on main's ref and are never cancelled; a dispatch on a branch queues on that branch and no longer shares main's group
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Scope (a pull request that changes only documents skips the build)
        # .github/docs-only.sh takes the pull request's changed files and applies the three conditions (a .md, outside the build's own folders, not read by the build). A push to main and a manual run never skip.
        # The job still ends green under the same name, so the required check passes. Every step below carries the condition.
        id: scope
        run: |
          set -u
          result=docs=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && list=$(git diff --name-status --no-renames HEAD^1 HEAD); then
            result=$(printf '%s\n' "$list" | sh .github/docs-only.sh) || result=docs=false
          fi
          echo "$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = docs=true ]; then
            { echo "Documents only: the build was skipped. Changed files:"; printf '%s\n' "$list" | cut -f2 | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Emscripten SDK (pinned in prototypes/face/emsdk.version)
        if: steps.scope.outputs.docs != 'true'
        # The Station's face is LVGL in C, built for the sandbox as WebAssembly (technical-architecture.md §8). The SDK
        # (about 1 GB installed) is cached by its pinned version.
        id: emsdk
        run: echo "version=$(cat prototypes/face/emsdk.version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.scope.outputs.docs != 'true'
        with:
          path: ~/emsdk
          key: emsdk-${{ steps.emsdk.outputs.version }}-ubuntu-24.04
      - name: Build the Station's face (LVGL 9.6 to WebAssembly, and native Linux)
        if: steps.scope.outputs.docs != 'true'
        # Build time and sizes are printed in the log. The face is built before the site is assembled so that
        # prototypes/face/dist travels with the sandbox bundle.
        run: |
          set -euo pipefail
          sudo apt-get install -y -q ninja-build bc >/dev/null
          if [ ! -f "$HOME/emsdk/emsdk" ]; then git clone --depth 1 --branch "$(cat prototypes/face/emsdk.version)" https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"; fi
          (cd "$HOME/emsdk" && ./emsdk install "${{ steps.emsdk.outputs.version }}" >/dev/null && ./emsdk activate "${{ steps.emsdk.outputs.version }}" >/dev/null)
          EMSDK="$HOME/emsdk" prototypes/face/build.sh all
      - name: Assemble the site
        if: steps.scope.outputs.docs != 'true'
        run: |
          set -euo pipefail
          mkdir -p _site/sandbox
          cp -r website/. _site/
          for p in prototypes/*/; do
            n=$(basename "$p")
            mkdir -p "_site/sandbox/$n"
            cp -r "$p". "_site/sandbox/$n/"
          done
          mkdir -p _site/ops && cp -r ops/ledger _site/ops/
          # the Companion's 48 px place art, from where it lives: the shipping folder only (sheets, palette and manifest)
          mkdir -p _site/art/companion-48/terrain && cp -r art/companion-48/terrain/meadow _site/art/companion-48/terrain/
          printf '{"commit":"%s","short":"%s","built":"%s"}\n' "$GITHUB_SHA" "${GITHUB_SHA:0:7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/build.json
      - name: Check the pages parse
        if: steps.scope.outputs.docs != 'true'
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'),os=require('os'),path=require('path'),{execFileSync}=require('child_process');const tmp=fs.mkdtempSync(path.join(os.tmpdir(),'parse-'));let n=0;
          for(const f of process.argv.slice(1)){const s=fs.readFileSync(f,'utf8');for(const m of s.matchAll(/<script(?![^>]*src)([^>]*)>([\s\S]*?)<\/script>/g)){
           if(/type=[\"']module[\"']/.test(m[1])){const t=path.join(tmp,(n++)+'.mjs');fs.writeFileSync(t,m[2]);execFileSync(process.execPath,['--check',t],{stdio:'inherit'});}else new Function(m[2]);}}
          console.log('scripts parse')" $(find _site -name '*.html')
      - name: Playwright's Chromium (cached by the Playwright version)
        if: steps.scope.outputs.docs != 'true'
        # The browser download was the one step whose time varied (30 s to 2 m 35 s). The key's 1.56.1 moves with playwright@1.56.1 below.
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pw
          key: playwright-1.56.1-chromium-ubuntu-24.04-${{ runner.arch }}
      - name: Smoke-test in a browser
        if: steps.scope.outputs.docs != 'true'
        run: |
          set -euo pipefail
          (cd _site && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 1
          npm --prefix "$RUNNER_TEMP" install --silent playwright@1.56.1
          # split and timed, so a slow run says which part was slow
          time npx --prefix "$RUNNER_TEMP" playwright install-deps chromium >/dev/null
          time PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw" npx --prefix "$RUNNER_TEMP" playwright install chromium >/dev/null
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw" PW_DIR="$RUNNER_TEMP" node .github/smoke.mjs
      - name: Import guard (the JavaScript drawing layer is removed)
        if: steps.scope.outputs.docs != 'true'
        # prototypes/face/removed.json lists every removed drawing module (lvgl-switch.md §5.1); the guard fails when one exists again or anything imports one, when the canvas is touched outside the face's
        # present and the named decoders, when JavaScript outside face/tests names an export of the node path, when a screen is registered with draw, nodes or faceNodes, or when an lv_*_create call
        # appears outside face/src/prim/. No exemptions. It reads the tree only, so it needs no base.
        run: node prototypes/face/tools/guard.mjs
      - name: Station rules and journey
        if: steps.scope.outputs.docs != 'true'
        timeout-minutes: 15   # the step takes about 4 minutes with the play-page journey; a hang fails fast instead of holding the runner for the job's six hours
        # The Station's rules and the Caddy service in Node, and the Station's browser journey on the face with the service
        # in mock mode beside it (a fixture save, a seeded pod, dock, the crates opened, Pods by keys, the rules of the screens that are
        # not built yet through their intents, Grow and Cross painting nothing, every not-built screen, Idle); station-build.md §5.
        # The play page's journey (prototypes/play/tools/journey.mjs) follows it: both devices on one page at 1×, the dock round trip with the keys and the landing rule, the narrow and short tiers,
        # a change of device pixel ratio, and printed figures.
        # The tests have the browser too: the specimen generator's oracle (prototypes/station/tests/specimen.test.mjs) runs the original in Chromium and compares the port to it.
        # The milestones whose screens are not on the face are listed from prototypes/station/tools/journey-pending/ on every run.
        run: |
          set -euo pipefail
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw" PW_DIR="$RUNNER_TEMP" node --test .github/roadmap.test.mjs prototypes/ui/tests/*.test.mjs prototypes/station/tests/*.test.mjs prototypes/exploration/tests/*.test.mjs prototypes/caddy/tests/*.test.mjs prototypes/face/tests/*.test.mjs prototypes/workbench/tests/framework.test.mjs prototypes/genome-stamp/tests/bins.test.mjs
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw" PW_DIR="$RUNNER_TEMP" node prototypes/station/tools/journey.mjs
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw" PW_DIR="$RUNNER_TEMP" node prototypes/play/tools/journey.mjs
      - name: Placed masters match their index
        if: steps.scope.outputs.docs != 'true'
        # Every master placed in prototypes/ui/assets/masters (by ui/tools/place-masters.mjs) is checked against its index entry: file present, size, SHA-256.
        run: node prototypes/ui/tools/place-masters.mjs --check
      - name: Station face fonts re-baked and compared
        if: steps.scope.outputs.docs != 'true'
        # The face's Inter fonts are generated C (prototypes/face/src/fonts) from the committed TrueType files by lv_font_conv,
        # pinned here to the version the sources were baked with; the bake is reproducible, so a diff means the sources or the
        # script changed without the fonts being re-baked.
        run: |
          npm install --prefix "$RUNNER_TEMP/lvfc" lv_font_conv@1.5.3
          sh prototypes/face/tools/bake-fonts.sh "$RUNNER_TEMP/lvfc/node_modules/.bin/lv_font_conv"
          git diff --exit-code -- prototypes/face/src/fonts
      - name: Station face in a browser (LVGL)
        if: steps.scope.outputs.docs != 'true'
        # The Station page boots the WebAssembly face and draws nothing else: LVGL 9.6.0, a 1024×600 display, keys in, the same pixels as
        # the native Linux build; the load time, the size on the wire and the cost of a full-frame copy (CPU throttled
        # 4× as a phone's stand-in) are printed.
        run: PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw" PW_DIR="$RUNNER_TEMP" node prototypes/face/tools/face-check.mjs
      - name: Station layer table in a browser (LVGL)
        if: steps.scope.outputs.docs != 'true'
        # Pods in each of its states and Home at each of its capture points on the Station page itself (the face in test mode, ?test): the pixels outside the palette on pass 1 (chrome)
        # and pass 2 (chrome and art) read 0, Home's regions have no departure from home.json and its budgets are printed, painted masters showing only on pass 3 (the art director's layer table); a page error, a render error or an error the face sent fails it.
        run: PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw" PW_DIR="$RUNNER_TEMP" node prototypes/face/tools/layer-check.mjs
      - name: Pods and Home goldens (LVGL)
        if: steps.scope.outputs.docs != 'true'
        # Each of Pods' states and Home's capture points drawn by the page's own face (the C words on the page's own pictures; Home with reduced motion, its two timed points on a virtual clock): the framebuffer hash against prototypes/face/golden/pods/pods.json and prototypes/face/golden/home/home.json.
        # With --logs, the face's log and the props facts of each golden's frame are written for the layout check (outside the tree).
        run: PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw" PW_DIR="$RUNNER_TEMP" node prototypes/face/tools/goldens.mjs --check --logs "$RUNNER_TEMP/layout-logs"
      - name: Layout check (report mode)
        if: steps.scope.outputs.docs != 'true'
        # Rules L0 to L11 (ui/specs/layout.mjs) over every golden's log: the index (JSON and Markdown, every finding) and the review set (one card per screen and rule, the worst
        # instance of each kind), with the cards' overlays only. Report mode: it fails only on a
        # finding of a rule frame.json layout.enforced lists for its screen, an unused exception, a malformed layout block, or L0 on an enforced screen.
        run: node prototypes/face/tools/layout-check.mjs "$RUNNER_TEMP/layout-logs" --out "$RUNNER_TEMP/layout-check" --overlays review
      - name: Layout check output
        if: always() && steps.scope.outputs.docs != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layout-check
          path: ${{ runner.temp }}/layout-check
          if-no-files-found: ignore
          retention-days: 14
      - name: Station layer checks
        if: steps.scope.outputs.docs != 'true'
        # What the journey recorded at each screenshot point, measured and printed (technical-architecture.md §5.6):
        # the chrome and art layers at exactly 0 off-palette pixels; the face's log (every string Inter at 16, 20 or 28 px,
        # none refused, no error, no canvas text call); every drawn region's box against its spec file; the stamp label
        # at 120 and the rail's tab count against the frame; where each frame region's ink lies against the spec.
        run: |
          set -euo pipefail
          node prototypes/station/tools/checks.mjs
      - name: Publish the tested bundle as a release
        if: github.ref == 'refs/heads/main' && steps.scope.outputs.docs != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -C _site -czf "sandbox-${GITHUB_SHA:0:7}.tar.gz" .
          sha256sum "sandbox-${GITHUB_SHA:0:7}.tar.gz" > "sandbox-${GITHUB_SHA:0:7}.sha256"
          tag="sandbox-${GITHUB_SHA:0:7}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "Sandbox $tag" \
            --notes "Tested site + prototypes at $GITHUB_SHA. The sandbox server installs the newest sandbox-* release." \
            "sandbox-${GITHUB_SHA:0:7}.tar.gz" "sandbox-${GITHUB_SHA:0:7}.sha256"
      - name: Keep only the five newest sandbox releases
        # Every push to main adds a bundle of 100+ MB; nothing ever removed them.
        # The sandbox server keeps its last five installs, so five on GitHub matches it.
        if: github.ref == 'refs/heads/main' && steps.scope.outputs.docs != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 500 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("sandbox-"))] | sort_by(.createdAt) | reverse | .[5:][].tagName' |
          while read -r tag; do
            echo "pruning $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
      - name: Push the same bundle to the gh-pages branch (temporary mirror)
        if: github.ref == 'refs/heads/main' && steps.scope.outputs.docs != 'true'
        run: |
          set -euo pipefail
          touch _site/.nojekyll
          # the copied prototypes carry their own .gitignore files (prototypes/face/.gitignore ignores dist/), which git add would honour
          find _site -name .gitignore -delete
          cd _site
          git init -q -b gh-pages
          git config user.name "sandbox-ci"
          git config user.email "sandbox-ci@users.noreply.github.com"
          git add -A
          git commit -qm "Sandbox mirror of ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
