# One-time: delete branches already merged into station-gate. Removed again right after it runs.
name: Branch cleanup
on:
  push:
    branches: [station-gate]
    paths: [.github/workflows/branch-cleanup.yml]
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for b in \
            claude/serene-brahmagupta-djp7c7 \
            build/ageing build/anti-drift build/build-footer build/caddy-panel-doc build/ci-lean \
            build/docs-oct26 build/docs-only-skip build/face-guard build/frame-panels build/keys-shared \
            build/kit-rules build/layout-check build/layout-tune build/lazy-rooms \
            build/library-art build/library-close build/library-compare build/library-family build/library-kit \
            build/library-l1 build/library-palette build/library-sheet build/library-species \
            build/loop-fixes build/names-es build/play-size build/pose-request build/props-words \
            build/rooms-r1 build/rooms-r2 build/rooms-r3 build/rooms-r4 build/rooms-r4b build/rooms-r4b1b \
            build/rooms-r4c build/rooms-r5 build/rooms-r6 build/site-oct26 \
            build/sitting-hold build/sitting-kit build/sitting-open build/sitting-poses build/sitting-props \
            build/sitting-reveal build/sitting-screen build/sittings-rule build/species-art \
            build/t-203-colour-ramps build/t-219-incubate-hatch-now build/test-play-1 build/tp1c \
            build/type-frame build/type-kit; do
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$b" >/dev/null 2>&1; then echo "deleted $b"; else echo "not deleted $b"; fi
          done
